    src: "Fontes: NASA GISTEMP v4 · desvio de referência GISS · IPCC AR6 · representação segundo Ed Hawkins / NASA SVS · CO₂: NOAA GML Mauna Loa; Law Dome (Etheridge et al., MacFarling Meure et al.) via NOAA NCEI Paleo",
  },
  zh: {
    title: "基准期、巴黎目标与图示解读",
    subtitle: "°C 数字的含义——以及这幅图示强调了什么",
    close: "关闭",
    note: '巴黎以 1850–1900 年为基准 (+0.19 °C) · 这是什么意思？&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · 每个数字都是距平值，而非温度计读数。",
        body:"螺旋图显示的并非<em>气温本身</em>，而是某月气温与某个固定参照期平均值之间的距平。在 NASA 的数据（GISTEMP）中，这一参照期是 <b>1951–1980</b> 年。“+1 °C”即表示：比这三十年的平均值高 1 °C。" },
      { h:"2 · 为什么有两个参照期？",
        body:"科学界采用 <b>1951–1980</b> 年，因为这一时期全球观测密集且可靠——为数据序列提供了一个稳定的零点。气候政策（《巴黎协定》）则以<b>“工业化前”（1850–1900 年）</b>为基准，因为其目标是限制<em>自工业化开始以来</em>的人为增暖。问题不同，零点也不同。" },
      { h:"3 · 偏移量：+0.19 °C。",
        body:"早在 1951–1980 年，全球气温就已比 1850–1900 年高出约 <b>0.19 °C</b>（NASA GISS 数值，据 GISTEMP 常见问题解答，截至 2025 年 1 月）。换算的方法就是加上这 0.19 °C。这正是为什么<b>巴黎基准线比同名的刻度环更靠内侧</b>：<ul><li>我们的<b>+1.5 °C 环</b> ≈ 工业化前基准的 <b>+1.7 °C</b>——已经<em>超出</em>了巴黎目标。</li><li>真正的<b>巴黎 1.5 °C 限值</b>在我们的坐标上位于 <b>+1.31 °C</b>，<b>2 °C 限值</b>位于 <b>+1.81 °C</b>。这正是“巴黎环”开关所描绘的内容。</li></ul><br><br><span class=\"sub\">这 0.19 °C 有多可靠。</span>这一换算比两位小数所暗示的要粗略得多：<ul><li><b>十二个月共用一个数值。</b>真实的偏移量存在季节变化：根据 Berkeley Earth 原始数据计算，其范围大致在 <b>+0.22 °C（7 月）</b>到 <b>+0.36 °C（11 月）</b>之间——0.14 °C 的跨度，与修正值本身相当。对年度及多年平均值而言，采用固定数值并无大碍；但对单个月份而言，它只是一个近似值。Copernicus 明确指出：对十二个月均值而言，这样的固定偏移已经够用，更短的时间段则需要额外假设。</li><li><b>偏移量因数据集而异。</b>Berkeley Earth 采用同样的 1951–1980 参照期，得出的偏移量为 <b>+0.31 °C</b>；WMO 将该偏移量的不确定性估计为 0.12 °C。以 +0.19 °C 计算，这一换算处于较低区间：对 2011–2020 年而言，换算结果为工业化前基准的 1.02 °C，而 IPCC AR6 对该十年增暖的评估值为 <b>1.09 °C</b>。</li><li><b>刻度环是参考线，不是定论。</b>它们标示的是巴黎阈值在这一坐标轴上的位置——并不代表这些阈值已经达到。IPCC 以<b>20 年均值</b>衡量是否超限（AR6 SPM，脚注 26；B.1.4 指出，单一年份超过 1.5 °C 并不意味着已达到该水平——仅内部变率就能使单一年份产生 ±0.25 °C 的波动）。以工业化前为基准计算，2006–2025 年的均值约为 1.04 °C。</li></ul>" },
      { h:"4 · 实话实说：单月纪录 ≠ 目标被突破。",
        body:"巴黎 1.5 °C 目标指的是<b>长期均值</b>（约 20 年），而非单个月份。2023 年 9 月这样的纪录月份，其工业化前基准距平早已超过 1.5 °C——但这一序列的 20 年均值（2006–2025 年）以工业化前为基准也才约为 <b>1.04 °C</b>。因此，“目标已被突破”这一说法还为时过早。坊间流传的关于“当前增暖幅度”的更高数值，衡量的是更短、更近期的时间窗口：该序列最近五年的均值约为 1.27 °C。自 2024 年以来，也已出现整段 12 个月期超过 1.5 °C 的情况（Copernicus/ERA5）——但巴黎目标衡量的是长期均值，而非单一年份。" },
      { h:"5 · 这一形状凸显了暖年——这是刻意为之，但值得了解。",
        body:"某月份的半径等于其距平值<em>加上</em>一个到中心的固定距离。因此，低温值紧靠中心，高温值则远在外侧——而在外侧，每一圈的周长都更长，因为周长随半径增大而增大。于是，暖年获得的线条和“墨量”比同等幅度的冷年偏离更多。三维漏斗形状进一步放大了这一效果：后期、较宽的圆环看起来比早期、颈部狭窄处的圆环更大。这<b>不是计算上的把戏</b>——这与 Ed Hawkins 和 NASA 可视化所采用的呈现方式相同——但了解这一点仍有必要。若想客观比较各年份的大小：<b>“俯视”</b>可将漏斗压平，<b>“高度”</b>滑块可调节夸张程度，而每个刻度环都标有其真实的 °C 数值。真正重要的是数字，而不是面积。" },
      { h:"6 · 2023/24 年的纪录并非仅仅是趋势所致。",
        body:"2023 年和 2024 年那些引人注目的峰值，恰逢一次强<b>厄尔尼诺</b>事件——这是一种自然现象，会在短时间内把太平洋中的额外热量推入全球气温。其下方的长期升温趋势才是人为增暖，但不应把单个纪录月份解读为新的常态。<b>“超强厄尔尼诺”</b>开关标示出最强的厄尔尼诺阶段（ONI 峰值 ≥ 2.0——最罕见的一类），便于将二者区分开来。" },
      { h:"CO₂：两个数据来源，一条曲线",
        body:"右侧的紫色曲线显示大气中的 CO₂ 浓度——这是原因，而螺旋图显示的是结果。<br><br><span class=\"sub\">两组数据，一道可见的接缝。</span>该曲线来自<b>两组</b>测量数据。自 1958 年 3 月起为 Mauna Loa 观测站（NOAA GML）的月度数值，此前则是根据南极冰芯得出的 Law Dome 平滑曲线。接缝被特意标示出来，而非隐藏：1958 年之前为<b>虚线</b>，之后为<b>实线</b>。<br><br><span class=\"sub\">为什么虚线部分如此平滑。</span>冰芯提供的是<em>年度</em>数值。为便于呈现，这些数值被插值到月度网格上——因此虚线部分是计算得出的，而非逐月实测。出于同样的原因，该部分也没有季节变化：空气需要大约十年才能被封存进粒雪层，这一过程抹平了季节性波动。自 1958 年起，季节变化本应可测——即北半球植被“呼吸”造成的约 6 ppm 年度波动。但图中依然没有画出：在一条宽度为 200 ppm 的色带上，6 ppm 还不到两个像素，看起来更像是描线不精准，而非真实信号。因此，该曲线始终显示的是去季节化后的趋势。<br><br><span class=\"sub\">为什么切换而非混合两组数据。</span>这两组数据测量的是不同的地点。在接缝处曲线本身并未出现跳变——两个数值相差 0.57 ppm，在一条宽度为 140 ppm 的色带上不可见。但在此后的几十年里，两者的差距系统性地扩大：Mauna Loa 位于北纬 19°，南极观测站则位于极南地区；由于几乎所有排放都发生在北半球，北半球的读数更高——1960 年约高 1.4 ppm，1990 年约高 3.4 ppm。这一差距随排放量增长而扩大。因此，这个数字本身就透露了燃烧发生在何处。" },
      { h:"这幅图表并未主张什么",
        body:"两条同时上升的曲线，只是一种<b>相关性</b>——并不是证明。CO₂ 驱动增暖这一结论，来自辐射物理学：来自对其吸收谱带的实验室测量，来自对射出长波辐射的卫星测量，来自对有无温室气体两种模式的比较。这幅图示只是把两组实测数据并列呈现，它既没有、也无法从一组数据推导出另一组。" },
      { h:"视角：为什么曲线在不同视角下看起来陡峭程度不同",
        body:"CO₂ 曲线位于三维空间中，因此其陡峭程度会随观察角度而变化。在默认视角下——镜头位于漏斗上方——顶部的 ppm 跨度比底部宽约 <b>25 %</b>。这使得最近的升幅看起来比实际所占的比例更大。<br><br>这是视角的属性，而非数据本身的属性。当视线与色带中线齐平时，这一效应会完全消失——这正是<em>侧视图</em>按钮的用途。而从下方观察时，效应甚至会反转，反而<em>低估</em>了升幅。<br><br>竖直网格线的畸变方式与曲线完全一致。因此，在任意高度读取的数值都是准确的：曲线在何处穿过 400 这条线，那里就是 400 ppm，与镜头位置无关。发生畸变的是坡度给人的印象——而不是数值本身。" },
      { h:"这套呈现由谁制作",
        body:"这并非原创研究成果，作者也不是气候科学家。该螺旋图可视化的是若干知名机构公开发布的数据序列：气温数据来自 <b>NASA GISTEMP v4</b>，CO₂ 数据来自 <b>Law Dome 冰芯</b>以及 <b>NOAA Global Monitoring Laboratory</b>（Mauna Loa 观测站）。所有数值均原样采用，处理过程也已公开记录。<br><br>这一呈现方式的优点与不足，均在本浮层中如实说明——关于几何呈现和基准期的章节，指出了已知的失真之处。如发现错误，欢迎反馈：<b>contact@aeternalabs.io</b>。<br><br>同一螺旋图也制作有成品视频，共四个版本（方形与竖版、德语与英语、含或不含巴黎环）——可在“观看螺旋视频版”处在线观看，并提供 4K 分辨率下载。" },
    ],
    co2Note: "CO₂：1958 年前为冰芯数据（虚线），此后为 Mauna Loa 观测数据 —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "数据来源：NASA GISTEMP v4 · GISS 基准偏移量 · IPCC AR6 · 呈现方式参考 Ed Hawkins / NASA SVS · CO₂：NOAA GML Mauna Loa；Law Dome（Etheridge et al., MacFarling Meure et al.）经由 NOAA NCEI Paleo",
  },
  ja: {
    title: "基準期とパリ目標、そしてこの図の読み方",
    subtitle: "°C の数字が意味すること——そしてこの図が何を強調しているか",
    close: "閉じる",
    note: 'パリ協定は1850–1900年を基準としています（+0.19 °C）· これはどういう意味でしょうか？&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · すべての数字は偏差であり、温度計の読み取り値ではありません。",
        body:"このスパイラルが示しているのは<em>気温そのもの</em>ではなく、ある月の気温が固定された基準期間の平均からどれだけ離れているかです。NASA のデータ（GISTEMP）では、この基準期は<b>1951–1980年</b>です。「+1 °C」とは、この30年間の平均より1 °C高いことを意味します。" },
      { h:"2 · なぜ基準期間が2つあるのでしょうか。",
        body:"科学の分野では<b>1951–1980年</b>が使われます。これは世界中で密に、かつ信頼性高く観測されている期間であり、データ系列にとって安定したゼロ点となるからです。一方、気候政策（パリ協定）は<b>「産業革命前」（1850–1900年）</b>を基準とします。目標が<em>産業化が始まって以来</em>の人為的な温暖化を抑えることだからです。問いが異なれば、ゼロ点も異なります。" },
      { h:"3 · 差分：+0.19 °C。",
        body:"1951–1980年の時点で、世界はすでに1850–1900年より約<b>0.19 °C</b>高かったのです（NASA GISS の数値、GISTEMP FAQによる、2025年1月時点）。換算とは、この0.19 °Cを加えることを意味します。だからこそ<b>パリ協定のラインは同名のリングよりも内側にあります</b>：<ul><li>私たちの<b>+1.5 °Cリング</b> ≈ 産業革命前比<b>+1.7 °C</b>——すでにパリ目標を<em>超えています</em>。</li><li>実際の<b>パリ協定の1.5 °C上限</b>はこのスケール上で<b>+1.31 °C</b>、<b>2 °C上限</b>は<b>+1.81 °C</b>に位置します。これはまさに「パリリング」の切り替えが描いているものです。</li></ul><br><br><span class=\"sub\">この0.19 °Cはどれほど確かなのでしょうか。</span>この換算は、小数点以下2桁が示すよりもずっと大まかなものです：<ul><li><b>12か月すべてに一つの値。</b>実際の差分には季節変動があります。Berkeley Earthの生データから計算すると、おおよそ<b>+0.22 °C（7月）</b>から<b>+0.36 °C（11月）</b>の範囲で、0.14 °Cという幅は補正値そのものと同じくらいの大きさです。年平均や複数年平均であれば固定値でも問題ありませんが、単月では近似値にすぎません。Copernicusも明確に述べています——12か月平均には固定の差分で十分だが、より短い期間には追加の仮定が必要になる、と。</li><li><b>差分はデータセットによって異なります。</b>Berkeley Earthは同じ1951–1980年を基準期とし、<b>+0.31 °C</b>という値を得ています。WMOはこの差分の不確実性を0.12 °Cと見積もっています。+0.19 °Cというこの換算値は低めの範囲にあり、2011–2020年について産業革命前比1.02 °Cという結果になりますが、IPCC AR6はこの10年間の温暖化を<b>1.09 °C</b>と評価しています。</li><li><b>リングは参照線であって、判定ではありません。</b>リングが示すのはこの軸上でパリ協定の閾値がどこに位置するかであり、その閾値にすでに到達したということではありません。IPCCは超過の判定を<b>20年平均</b>で行います（AR6 SPM 脚注26。B.1.4では、単年で1.5 °Cを超えてもその水準に達したことにはならないと明記されています——内部変動だけで単年の値は±0.25 °C動きうるためです）。産業革命前を基準に換算すると、2006–2025年の平均は約1.04 °Cです。</li></ul>" },
      { h:"4 · 正直に言うと：記録的な月 ≠ 目標超過ではありません。",
        body:"パリ協定の1.5 °C目標が指すのは<b>長期平均</b>（約20年）であり、個々の月ではありません。2023年9月のような記録的な月は、産業革命前比ですでに1.5 °Cを超えていました——しかし、この系列の20年平均（2006–2025年）は産業革命前比で約<b>1.04 °C</b>にとどまっています。したがって、「目標はすでに超過した」と言うのは時期尚早でしょう。「現在の温暖化」として出回るより高い数値は、より短く、より最近の期間を測定したものです。この系列の直近5年間の平均は約1.27 °Cです。2024年以降、12か月間まるごと1.5 °Cを超えた期間もすでに存在します（Copernicus/ERA5）——ですが、パリ協定が測るのは長期平均であり、単年ではありません。" },
      { h:"5 · この形は暖かい年を強調します——意図的にですが、知っておく価値があります。",
        body:"ある月の半径は、その偏差に中心までの一定の距離を<em>加えた</em>ものです。そのため、低い値は中心近くに集まり、高い値は外側に大きく広がります——そして外側では、円周が半径とともに大きくなるため、一周の長さもより長くなります。その結果、暖かい年は同じ大きさの下振れよりも多くの線と多くの「インク」を得ることになります。3Dの漏斗形状はこの効果をさらに強めます：後半の幅広いリングは、首の部分の狭い初期のリングよりも大きく見えるのです。これは<b>計算上のトリックではありません</b>——Ed HawkinsやNASAの可視化と同じ表現方法です——ですが、知っておく価値はあります。大きさを客観的に比較したい場合は、<b>「上面図」</b>で漏斗を平らに展開でき、<b>「高さ」</b>スライダーでどの程度誇張するかを調整でき、さらに各目盛りリングには実際の°C値が記されています。重要なのは数字であり、面積ではありません。" },
      { h:"6 · 2023年・2024年の記録は、トレンドだけによるものではありません。",
        body:"2023年と2024年の著しい急騰は、強い<b>エルニーニョ</b>期と重なっていました——これは、太平洋の余分な熱を一時的に世界の気温へ押し出す自然現象です。その下にある長期的な上昇が人為的な温暖化であり、単月の記録を新しい常態として読み取るべきではありません。<b>「スーパーエルニーニョ」</b>の切り替えは最も強いエルニーニョ期（ONI ピーク ≥ 2.0——最も稀な区分）を示し、両者を見分けられるようにしています。" },
      { h:"CO₂：2つのデータ源、1本の曲線",
        body:"右側の紫色の曲線は、大気中のCO₂濃度——原因——を示しています。一方、スパイラルが示すのは結果です。<br><br><span class=\"sub\">2つの記録、1つの目に見える継ぎ目。</span>このデータは<b>2つ</b>の観測記録から成ります。1958年3月以降はMauna Loa観測所（NOAA GML）による月次の値、それ以前は南極の氷床コアによるLaw Domeのスプライン曲線です。この継ぎ目は隠さず見えるようにしてあります：1958年より前は<b>破線</b>、それ以降は<b>実線</b>です。<br><br><span class=\"sub\">なぜ破線部分は滑らかなのか。</span>氷床コアが与えるのは<em>年単位</em>の値です。表示のためにこれを月次の格子へ補間しているため、破線部分は計算によるものであり、月ごとに実測されたものではありません。同じ理由で、この部分には季節変動もありません：大気がフィルン層に閉じ込められるまでには10年ほどかかり、その過程で季節的な変動は均されてしまうのです。1958年以降であれば測定可能だったはずです——北半球の植生の「呼吸」による、年間およそ6 ppmの変動です。それでも描かれていません：幅200 ppmの帯の上では、6 ppmは2ピクセルにも満たず、信号というより雑に引かれた線のように見えてしまうからです。そのため、この曲線は一貫して季節調整済みのトレンドを示しています。<br><br><span class=\"sub\">なぜ混ぜ合わせず、切り替えるのか。</span>2つの観測記録は異なる場所を測定しています。継ぎ目そのものでは曲線が飛ぶことはありません——そこでの差は0.57 ppmで、幅140 ppmの帯の上では見分けがつきません。しかしその後の数十年にわたって、両者は体系的に乖離していきます：Mauna Loaは北緯19°、南極の観測地点ははるか南に位置し、排出のほとんどが北半球で発生するため、北側の数値の方が高く出ます——1960年で約1.4 ppm、1990年で約3.4 ppmの差です。この差は排出量とともに拡大します。つまりこの数字自体が、どこで燃焼が起きているかを物語っているのです。" },
      { h:"この図が主張していないこと",
        body:"同時に上昇する2本の曲線は<b>相関関係</b>にすぎません——証明ではありません。CO₂が温暖化を引き起こしているという理解は、放射物理学から得られています：吸収帯の実験室測定、外向き長波放射の衛星観測、温室効果ガスの有無によるモデル比較などです。この図は2つの実測データ系列を並べて示しているだけであり、一方をもう一方から導き出しているわけではなく、そうすることもできません。" },
      { h:"視点：見る角度によって曲線の傾きが違って見える理由",
        body:"CO₂の曲線は三次元空間上にあるため、見る角度によって傾きが急に見えたり緩やかに見えたりします。標準表示——カメラが漏斗の上方にある状態——では、上部のppmの幅は下部よりも約<b>25 %広く</b>なります。そのため、直近の上昇は実際よりも少し大げさに見えてしまいます。<br><br>これはデータの性質ではなく、視点による見え方の問題です。帯の中央と同じ高さから見ると、この効果は完全に消えます——そのためにあるのが<em>側面図</em>ボタンです。下から見ると効果は逆転し、むしろ上昇を<em>過小に</em>見せます。<br><br>縦の格子線も曲線とまったく同じように歪んでいます。そのため、どの高さで読み取っても値そのものは正確です：曲線が400のラインを横切る場所は、カメラの位置に関わらず400 ppmです。歪んでいるのは傾きの印象であって、数値ではありません。" },
      { h:"これを作った人について",
        body:"これは独自の研究ではなく、作者は気候科学者でもありません。このスパイラルは、名前の挙がっている機関が公開しているデータ系列を可視化したものです：気温は<b>NASA GISTEMP v4</b>、CO₂は<b>Law Dome氷床コア</b>と<b>NOAA Global Monitoring Laboratory</b>（Mauna Loa）によるものです。数値は変更せずにそのまま用いており、加工の過程も記録として公開しています。<br><br>この可視化ができていること、そして弱い点については、このオーバーレイの中で率直に述べています——ジオメトリと基準期間についての節で、既知の歪みを説明しています。誤りを見つけた方は、ご指摘をお待ちしています：<b>contact@aeternalabs.io</b>。<br><br>同じスパイラルは、完成映像としても4つのバージョン（正方形と縦型、ドイツ語と英語、パリリングの有無）で公開されています——「スパイラルを動画で見る」から視聴でき、4Kでのダウンロードも可能です。" },
    ],
    co2Note: "CO₂：1958年までは氷床コア（破線）、それ以降はMauna Loa観測値 —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "出典：NASA GISTEMP v4 · GISS基準差分 · IPCC AR6 · 可視化はEd Hawkins / NASA SVSに準拠 · CO₂：NOAA GML Mauna Loa；Law Dome（Etheridge et al., MacFarling Meure et al.）経由 NOAA NCEI Paleo",
  },
  ru: {
    title: "Базовый период, цели Парижа и как читать эту диаграмму",
    subtitle: "Что означают цифры в °C — и что подчёркивает эта диаграмма",
    close: "Закрыть",
    note: 'Париж измеряет относительно 1850–1900 годов (+0,19 °C) · что это значит?&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · Каждое число — это аномалия, а не показание термометра.",
        body:"Спираль показывает не <em>саму</em> температуру, а то, насколько месяц отклоняется от среднего значения за фиксированный базовый период. Для данных NASA (GISTEMP) это <b>1951–1980 годы</b>. То есть «+1 °C» означает: на 1 °C теплее среднего за эти три десятилетия." },
      { h:"2 · Почему два базовых периода?",
        body:"Наука использует <b>1951–1980 годы</b>, потому что этот период плотно и надёжно измерен по всему миру — это стабильная нулевая точка для ряда данных. Климатическая политика (Парижское соглашение) измеряет относительно <b>«доиндустриального периода» (1850–1900 годы)</b>, поскольку цель — ограничить антропогенное потепление <em>с начала индустриализации</em>. Другой вопрос — другая нулевая точка." },
      { h:"3 · Смещение: +0,19 °C.",
        body:"Уже в 1951–1980 годах мир был примерно на <b>0,19 °C теплее</b>, чем в 1850–1900 годах (значение NASA GISS согласно FAQ GISTEMP, по состоянию на январь 2025 года). Пересчёт означает прибавление этих 0,19 °C. Поэтому <b>линии Парижа расположены ближе к центру</b>, чем одноимённые кольца:<ul><li>Наше <b>кольцо +1,5 °C</b> ≈ <b>+1,7 °C относительно доиндустриального уровня</b> — уже <em>за пределами</em> цели Парижа.</li><li>Реальный <b>предел Парижа в 1,5 °C</b> на нашей шкале находится на отметке <b>+1,31 °C</b>, а <b>предел в 2 °C</b> — на <b>+1,81 °C</b>. Именно это отображает переключатель «Кольца Парижа».</li></ul><br><br><span class=\"sub\">Насколько надёжны эти 0,19 °C.</span> Пересчёт грубее, чем предполагают два знака после запятой:<ul><li><b>Одно значение на все двенадцать месяцев.</b> У реального смещения есть сезонный ход: по расчётам на основе исходных данных Berkeley Earth оно колеблется примерно от <b>+0,22 °C (июль)</b> до <b>+0,36 °C (ноябрь)</b> — разброс в 0,14 °C, то есть сопоставимый с самой поправкой. Для годовых и многолетних средних фиксированное значение безобидно, для отдельного месяца это лишь приближение. Copernicus прямо указывает: для двенадцатимесячных средних такого смещения достаточно, для более коротких периодов нужны дополнительные допущения.</li><li><b>Смещение зависит от набора данных.</b> Berkeley Earth использует тот же базовый период 1951–1980 и получает <b>+0,31 °C</b>; ВМО оценивает неопределённость этого смещения в 0,12 °C. При +0,19 °C данный пересчёт находится у нижней границы: для 2011–2020 годов он даёт 1,02 °C относительно доиндустриального уровня, тогда как МГЭИК в AR6 оценивает потепление за это десятилетие в <b>1,09 °C</b>.</li><li><b>Кольца — это линия отсчёта, а не приговор.</b> Они показывают, где на этой оси находятся пороги Парижа, — а не то, что они уже достигнуты. МГЭИК судит о превышении по <b>20-летнему среднему</b> (AR6 SPM, сноска 26; в пункте B.1.4 указано, что превышение 1,5 °C в отдельном году ещё не означает достижения этого уровня — одна только внутренняя изменчивость может сдвигать значение отдельного года на ±0,25 °C). При пересчёте на доиндустриальный уровень среднее за 2006–2025 годы составляет около 1,04 °C.</li></ul>" },
      { h:"4 · Честно говоря: рекордный месяц ≠ превышение цели.",
        body:"Цель Парижского соглашения в 1,5 °C относится к <b>долгосрочному среднему</b> (~20 лет), а не к отдельным месяцам. Рекордные месяцы, такие как сентябрь 2023 года, уже превысили 1,5 °C относительно доиндустриального уровня — однако 20-летнее среднее этого ряда (2006–2025 годы) составляет относительно доиндустриального уровня лишь около <b>1,04 °C</b>. Поэтому утверждение «цель уже превышена» было бы преждевременным. Более высокие цифры, которые приводятся для «текущего потепления», измеряют более короткие и более недавние периоды: среднее за последние пять лет этого ряда составляет около 1,27 °C. Целые 12-месячные периоды уже превышали 1,5 °C начиная с 2024 года (Copernicus/ERA5) — но Парижское соглашение оценивается по долгосрочному среднему, а не по отдельным годам." },
      { h:"5 · Форма подчёркивает тёплые годы — намеренно, но об этом стоит знать.",
        body:"Радиус месяца — это его аномалия <em>плюс</em> фиксированное расстояние до центра. Поэтому холодные значения располагаются плотно у центра, а тёплые — далеко снаружи, и там же, снаружи, каждый виток длиннее, поскольку длина окружности растёт вместе с радиусом. Так тёплые годы получают больше линии и больше «чернил», чем равные по величине отклонения вниз. 3D-воронка усиливает этот эффект: поздние, широкие кольца выглядят крупнее ранних в узкой горловине. Это <b>не вычислительный трюк</b> — это тот же способ представления, что используют Ed Hawkins и визуализация NASA, — но об этом стоит знать. Чтобы объективно сравнить величины: <b>«Вид сверху»</b> разворачивает воронку в плоскость, ползунок <b>«Высота»</b> задаёт степень преувеличения, а каждое кольцо шкалы несёт своё настоящее значение в °C. Важно число, а не площадь." },
      { h:"6 · Рекорды 2023/24 годов — не только тренд.",
        body:"Впечатляющие скачки 2023 и 2024 годов пришлись на сильную фазу <b>Эль-Ниньо</b> — естественное явление, которое на время выталкивает дополнительное тепло из Тихого океана в глобальную температуру. Долгосрочный рост под этим — антропогенное потепление, но отдельный рекордный месяц не стоит воспринимать как новую норму. Переключатель <b>«Супер-Эль-Ниньо»</b> отмечает самые сильные фазы Эль-Ниньо (пик ONI ≥ 2,0 — редчайшая категория), чтобы можно было различать эти два явления." },
      { h:"CO₂: два источника, одна кривая",
        body:"Фиолетовая кривая справа показывает концентрацию CO₂ в атмосфере — причину, тогда как спираль показывает следствие.<br><br><span class=\"sub\">Два ряда данных, один видимый шов.</span> Она составлена из <b>двух</b> рядов измерений. С марта 1958 года это месячные значения со станции Мауна-Лоа (NOAA GML), до этого — сплайн Law Dome по антарктическим ледяным кернам. Шов не скрыт, а показан: <b>пунктиром</b> до 1958 года, <b>сплошной линией</b> после.<br><br><span class=\"sub\">Почему пунктирный участок такой гладкий.</span> Ледяной керн даёт значения за <em>год</em>. Для отображения они интерполируются в месячную сетку — поэтому пунктирный участок вычислен, а не измерен помесячно. По той же причине там отсутствует сезонный ход: воздух запечатывается в фирновом слое около десяти лет, и за это время сезонные колебания сглаживаются. С 1958 года их уже можно было бы измерить — это «дыхание» растительности Северного полушария, около 6 ppm в год. Тем не менее оно не отображено: на полосе шириной 200 ppm 6 ppm — это меньше двух пикселей, что выглядело бы скорее как неаккуратно проведённая линия, чем как сигнал. Поэтому кривая на всём протяжении показывает тренд с исключённой сезонностью.<br><br><span class=\"sub\">Почему переключение, а не смешение.</span> Два ряда измеряют разные места. В самом шве кривая не совершает скачка — там значения расходятся на 0,57 ppm, что незаметно на полосе шириной 140 ppm. Но на протяжении следующих десятилетий они систематически расходятся: Мауна-Лоа находится на 19° северной широты, антарктические станции — далеко на юге, и поскольку почти все выбросы происходят в Северном полушарии, там показания выше — около 1,4 ppm в 1960 году и около 3,4 ppm к 1990 году. Разрыв растёт вместе с выбросами. Эта цифра сама по себе показывает, где происходит сжигание топлива." },
      { h:"Чего эта диаграмма не утверждает",
        body:"Две кривые, растущие одновременно, — это <b>корреляция</b>, а не доказательство. То, что CO₂ вызывает потепление, известно из физики излучения: из лабораторных измерений полос поглощения, из спутниковых измерений уходящего длинноволнового излучения, из сравнения моделей с парниковыми газами и без них. Эта диаграмма показывает два измеренных ряда данных рядом друг с другом. Она не выводит один ряд из другого и не может этого сделать." },
      { h:"Перспектива: почему кривая выглядит по-разному в зависимости от угла обзора",
        body:"Кривая CO₂ расположена в трёхмерном пространстве, поэтому в зависимости от угла обзора она выглядит более или менее крутой. В стандартном виде — камера над воронкой — диапазон ppm наверху примерно на <b>25 % шире</b>, чем внизу. Из-за этого последний рост выглядит немного заметнее, чем есть на самом деле.<br><br>Это свойство угла обзора, а не самих данных. На уровне середины полосы этот эффект полностью исчезает — для этого и существует кнопка <em>«Вид сбоку»</em>. При взгляде снизу эффект даже меняется на противоположный и <em>занижает</em> рост.<br><br>Вертикальные линии сетки искажаются точно так же, как и кривая. Поэтому любое считанное значение верно на любой высоте: там, где кривая пересекает линию 400, это именно 400 ppm — независимо от положения камеры. Искажается впечатление о крутизне, а не сама цифра." },
      { h:"Кто это сделал",
        body:"Это не самостоятельное исследование, и автор не климатолог. Спираль визуализирует опубликованные ряды данных названных организаций: температуры — из <b>NASA GISTEMP v4</b>, CO₂ — из <b>ледяного керна Law Dome</b> и от <b>NOAA Global Monitoring Laboratory</b> (Мауна-Лоа). Значения использованы без изменений, обработка задокументирована.<br><br>Сильные и слабые стороны этой визуализации открыто изложены в этом окне — разделы о геометрии и базовом периоде называют известные искажения. Если вы нашли ошибку — сообщения приветствуются: <b>contact@aeternalabs.io</b>.<br><br>Та же спираль доступна в виде готового видео в четырёх версиях (квадратной и вертикальной, на немецком и английском языках, с кольцами Парижа и без них) — посмотреть и скачать в 4K можно по ссылке «Смотреть спираль как видео»." },
    ],
    co2Note: "CO₂: ледяной керн до 1958 года (пунктир), затем данные Мауна-Лоа —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "Источники: NASA GISTEMP v4 · базовое смещение GISS · IPCC AR6 · визуализация по методу Ed Hawkins / NASA SVS · CO₂: NOAA GML Мауна-Лоа; Law Dome (Etheridge et al., MacFarling Meure et al.) через NOAA NCEI Paleo",
  },
  uk: {
    title: "Базовий період, цілі Парижа та як читати цю діаграму",
    subtitle: "Що означають цифри в °C — і що підкреслює ця діаграма",
    close: "Закрити",
    note: 'Париж вимірює відносно 1850–1900 років (+0,19 °C) · що це означає?&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · Кожне число — це аномалія, а не показник термометра.",
        body:"Спіраль показує не <em>саму</em> температуру, а те, наскільки місяць відхиляється від середнього значення за фіксований базовий період. Для даних NASA (GISTEMP) це <b>1951–1980 роки</b>. Тобто «+1 °C» означає: на 1 °C тепліше за середнє цих трьох десятиліть." },
      { h:"2 · Чому два базові періоди?",
        body:"Наука використовує <b>1951–1980 роки</b>, тому що цей період щільно і надійно виміряний у всьому світі — це стабільна нульова точка для ряду даних. Кліматична політика (Паризька угода) вимірює відносно <b>«доіндустріального періоду» (1850–1900 роки)</b>, оскільки мета — обмежити антропогенне потепління <em>з початку індустріалізації</em>. Інше питання — інша нульова точка." },
      { h:"3 · Зсув: +0,19 °C.",
        body:"Уже в 1951–1980 роках світ був приблизно на <b>0,19 °C теплішим</b>, ніж у 1850–1900 роках (значення NASA GISS за даними FAQ GISTEMP, станом на січень 2025 року). Перерахунок означає додавання цих 0,19 °C. Тому <b>лінії Парижа розташовані ближче до центру</b>, ніж однойменні кільця:<ul><li>Наше <b>кільце +1,5 °C</b> ≈ <b>+1,7 °C відносно доіндустріального рівня</b> — уже <em>за межами</em> цілі Парижа.</li><li>Реальна <b>межа Парижа 1,5 °C</b> на нашій шкалі перебуває на позначці <b>+1,31 °C</b>, а <b>межа 2 °C</b> — на <b>+1,81 °C</b>. Саме це відображає перемикач «Кільця Парижа».</li></ul><br><br><span class=\"sub\">Наскільки надійні ці 0,19 °C.</span> Перерахунок грубіший, ніж припускають два знаки після коми:<ul><li><b>Одне значення на всі дванадцять місяців.</b> Реальний зсув має сезонний хід: за розрахунками на основі вихідних даних Berkeley Earth він коливається приблизно від <b>+0,22 °C (липень)</b> до <b>+0,36 °C (листопад)</b> — розкид у 0,14 °C, тобто порівнянний із самою поправкою. Для річних і багаторічних середніх фіксоване значення нешкідливе, для окремого місяця це лише наближення. Copernicus прямо зазначає: для дванадцятимісячних середніх такого зсуву достатньо, коротші періоди потребують додаткових припущень.</li><li><b>Зсув залежить від набору даних.</b> Berkeley Earth використовує той самий базовий період 1951–1980 і отримує <b>+0,31 °C</b>; ВМО оцінює невизначеність цього зсуву в 0,12 °C. При +0,19 °C цей перерахунок перебуває біля нижньої межі: для 2011–2020 років він дає 1,02 °C відносно доіндустріального рівня, тоді як МГЕЗК в AR6 оцінює потепління за це десятиліття в <b>1,09 °C</b>.</li><li><b>Кільця — це лінія відліку, а не вирок.</b> Вони показують, де на цій осі перебувають пороги Парижа, — а не те, що вони вже досягнуті. МГЕЗК судить про перевищення за <b>20-річним середнім</b> (AR6 SPM, виноска 26; у пункті B.1.4 зазначено, що перевищення 1,5 °C в окремому році ще не означає досягнення цього рівня — сама лише внутрішня мінливість може зсувати значення окремого року на ±0,25 °C). У перерахунку на доіндустріальний рівень середнє за 2006–2025 роки становить близько 1,04 °C.</li></ul>" },
      { h:"4 · Чесно кажучи: рекордний місяць ≠ порушення цілі.",
        body:"Ціль Паризької угоди в 1,5 °C стосується <b>довгострокового середнього</b> (~20 років), а не окремих місяців. Рекордні місяці, такі як вересень 2023 року, вже перевищили 1,5 °C відносно доіндустріального рівня — однак 20-річне середнє цього ряду (2006–2025 роки) становить відносно доіндустріального рівня лише близько <b>1,04 °C</b>. Тому твердження «ціль уже перевищено» було б передчасним. Вищі цифри, які наводять для «поточного потепління», вимірюють коротші й новіші періоди: середнє за останні п’ять років цього ряду становить близько 1,27 °C. Цілі 12-місячні періоди вже перевищували 1,5 °C починаючи з 2024 року (Copernicus/ERA5) — але Паризьку угоду оцінюють за довгостроковим середнім, а не за окремими роками." },
      { h:"5 · Форма підкреслює теплі роки — свідомо, але про це варто знати.",
        body:"Радіус місяця — це його аномалія <em>плюс</em> фіксована відстань до центру. Тому холодні значення розташовані щільно біля центру, а теплі — далеко зовні, і саме зовні кожен виток довший, оскільки довжина кола зростає разом із радіусом. Так теплі роки отримують більше лінії й більше «чорнила», ніж рівні за величиною відхилення вниз. 3D-лійка посилює цей ефект: пізні, широкі кільця виглядають більшими за ранні у вузькому горлі. Це <b>не обчислювальний трюк</b> — це той самий спосіб подання, який використовують Ed Hawkins і візуалізація NASA — але про це варто знати. Щоб об’єктивно порівняти величини: <b>«Вигляд згори»</b> розгортає лійку в площину, повзунок <b>«Висота»</b> задає ступінь перебільшення, а кожне кільце шкали несе своє справжнє значення в °C. Важливе число, а не площа." },
      { h:"6 · Рекорди 2023/24 років — це не лише тренд.",
        body:"Вражаючі стрибки 2023 і 2024 років припали на сильну фазу <b>Ель-Ніньйо</b> — природне явище, яке тимчасово додає тепла з Тихого океану до глобальної температури. Довгостроковий підйом під цим — антропогенне потепління, але окремий рекордний місяць не варто сприймати як новий постійний стан. Перемикач <b>«Супер-Ель-Ніньйо»</b> позначає найсильніші фази Ель-Ніньйо (пік ONI ≥ 2,0 — найрідкісніша категорія), щоб можна було розрізняти ці два явища." },
      { h:"CO₂: два джерела, одна крива",
        body:"Фіолетова крива праворуч показує концентрацію CO₂ в атмосфері — причину, тоді як спіраль показує наслідок.<br><br><span class=\"sub\">Два ряди даних, один видимий шов.</span> Вона складена з <b>двох</b> рядів вимірювань. З березня 1958 року це місячні значення зі станції Мауна-Лоа (NOAA GML), до цього — сплайн Law Dome за антарктичними льодовими кернами. Шов не приховано, а показано: <b>пунктиром</b> до 1958 року, <b>суцільною лінією</b> після.<br><br><span class=\"sub\">Чому пунктирна ділянка така гладка.</span> Льодовий керн дає значення за <em>рік</em>. Для відображення їх інтерполюють у місячну сітку — тому пунктирна ділянка обчислена, а не виміряна помісячно. З тієї самої причини там відсутній сезонний хід: повітря запечатується у фірновому шарі протягом приблизно десяти років, і за цей час сезонні коливання згладжуються. Із 1958 року їх уже можна було б виміряти — це «дихання» рослинності Північної півкулі, близько 6 ppm на рік. Проте воно не відображене: на смузі шириною 200 ppm 6 ppm — це менше двох пікселів, що виглядало б радше як недбало проведена лінія, ніж як сигнал. Тому крива на всій довжині показує тренд з вилученою сезонністю.<br><br><span class=\"sub\">Чому перемикання, а не змішування.</span> Два ряди вимірюють різні місця. У самому шві крива не робить стрибка — там значення розходяться на 0,57 ppm, що непомітно на смузі шириною 140 ppm. Але протягом наступних десятиліть вони систематично розходяться: Мауна-Лоа розташована на 19° північної широти, антарктичні станції — далеко на півдні, і оскільки майже всі викиди відбуваються в Північній півкулі, там показники вищі — близько 1,4 ppm у 1960 році і близько 3,4 ppm до 1990 року. Розрив зростає разом із викидами. Ця цифра сама по собі показує, де відбувається спалювання палива." },
      { h:"Чого ця діаграма не стверджує",
        body:"Дві криві, що одночасно зростають, є <b>кореляцією</b>, а не доказом. Те, що CO₂ спричиняє потепління, відомо з фізики випромінювання: з лабораторних вимірювань смуг поглинання, із супутникових вимірювань вихідного довгохвильового випромінювання, з порівняння моделей із парниковими газами та без них. Ця діаграма показує два виміряних ряди даних поруч один з одним. Вона не виводить один ряд з іншого і не може цього зробити." },

          for(const r of radii) seg.push(r*sinA, y0, r*cosA, r*sinA, y1, r*cosA); }
        const gg=new THREE.LineSegmentsGeometry(); gg.setPositions(seg);
        const gm=new THREE.LineMaterial({ color:0x78716C, linewidth:1.0, transparent:true, opacity, fog:false });   // the 0.24/0.12 hierarchy must not be modulated by distance
        gm.resolution.set(SW, SH);
        const gl=new THREE.LineSegments2(gg, gm); gl.frustumCulled=false; gl.renderOrder=1; gl.visible=false; co2Axis.add(gl);
        return { l:gl, m:gm, lines:radii.length, base:opacity };
      };
      co2Grid={ major:mkGrid([250,350,450], 0.24), minor:mkGrid([300,400], 0.12), segs:spineSegs };
    }
  }

  // ---- translucent vertical guide cylinders, one per temperature ring (toggleable per ring) ----
  // additive blending so the faint walls glow against the black background instead of vanishing into it
  const guideCyls = ringVals.map(v=>{ const isZero=Math.abs(v)<1e-9;
    const geo=new THREE.CylinderGeometry(rho(v), rho(v), 1, 96, 1, true);  // unit height, open-ended; scaled per-frame
    // fog:true is the whole point of the depth cue: these are the big enclosing shapes, additive,
    // open-ended and depth-write-free, so front and back wall are otherwise pixel-identical. Under
    // additive blending "mix toward black" is just "adds less light", so the far wall simply glows
    // less — no haze, no grey wash.
    const mat=new THREE.MeshBasicMaterial({ color:isZero?0xe8e4dd:vhex(v), transparent:true, opacity:0.11, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending, fog:true });
    const m=new THREE.Mesh(geo, mat); m.renderOrder=0; m.visible=cylOn.has(v); scene.add(m); return { m, v };
  });

  // Paris guide cylinders (copper walls at the pre-industrial thresholds) — global only, toggled separately
  let parisCyls = [];
  if (DSKEY === "global") {
    parisCyls = [1.5, 2.0].map(pv => {
      const r = rho(pv - PARIS_OFFSET);
      const geo = new THREE.CylinderGeometry(r, r, 1, 96, 1, true);
      const mat = new THREE.MeshBasicMaterial({ color: pv===2.0 ? 0xEF4444 : 0xE9B863, transparent:true, opacity:0.11, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending, fog:true });   // same class as the ring cylinders
      const m = new THREE.Mesh(geo, mat); m.renderOrder=0; m.visible=parisCylOn.has(pv); scene.add(m); return { m, v:pv };
    });
  }

  const gt=glowTex();
  // fog:false on both — the comet head marks WHERE THE SERIES IS RIGHT NOW. A head that dims as it
  // swings to the back of the funnel would look like the playback faded, not like it moved away.
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,fog:false}));
  glow.scale.set(1.1,1.1,1); glow.renderOrder=6; scene.add(glow);
  const head=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,transparent:true,depthTest:false,depthWrite:false,fog:false}));
  head.scale.set(0.32,0.32,1); head.renderOrder=7; scene.add(head);

  // ---- event markers — global dataset only. Two sets: key events (copper) + strong El Niños (teal) ----
  // labels live as screen-space HTML callouts in a chronological margin column (+ SVG leaders); only the dots are 3D
  const annot=document.getElementById("annot"), annotSvg=document.getElementById("annotSvg");
  annot.querySelectorAll(".callout").forEach(n=>n.remove());
  while(annotSvg.firstChild) annotSvg.removeChild(annotSvg.firstChild);
  let events = [], ninos = [], ninoBands = [];
  if (DSKEY === "global") {
    const mk = (ev, dotHex, accentCss, cls) => {
      const i = (ev.y-1880)*12 + (ev.m-1);
      if (i<0 || i>=N) return null;
      const dot = new THREE.Sprite(new THREE.SpriteMaterial({ map:gt, color:dotHex, transparent:true, opacity:0, depthTest:false, depthWrite:false, fog:false }));   // anchor for an HTML callout — it must stay findable at the end of its leader line
      dot.scale.set(0.32,0.32,1); dot.renderOrder=8; dot.visible=false; scene.add(dot);
      const el = document.createElement("div"); el.className="callout"+(cls?" "+cls:"");
      el.textContent = pick(ev); el.style.visibility="hidden"; annot.appendChild(el);
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("stroke", accentCss); path.setAttribute("fill","none");
      path.setAttribute("stroke-width","1"); path.setAttribute("opacity","0.5");
      path.style.display="none"; annotSvg.appendChild(path);
      return { i, dot, el, path, w:0, h:0 };
    };
    events = EVENTS.map(ev => mk(ev, 0xD8A24A, "rgba(216,162,74,0.9)")).filter(Boolean);
    ninos  = EL_NINO.map(ev => mk(ev, 0x4FC3D6, "rgba(79,195,214,0.9)", "nino")).filter(Boolean);
    // span "halos": one thicker teal underlay per event, tracing its ONI>=1.0 core months on the spiral
    const haloW = parseFloat(document.getElementById("lineWidth").value) * HALO_MUL;
    ninoBands = EL_NINO.map(ev => {
      if (!ev.on || !ev.off) return null;
      const a = Math.max(0, (ev.on.y-1880)*12 + (ev.on.m-1));
      const b = Math.min(N-1, (ev.off.y-1880)*12 + (ev.off.m-1));
      if (b - a < 1) return null;
      const pos = new Float32Array((b-a+1)*3);
      for (let k=0;k<=b-a;k++){ const i=a+k; pos[3*k]=baseX[i]; pos[3*k+1]=yFull[i]; pos[3*k+2]=baseZ[i]; }
      const geo = new THREE.LineGeometry(); geo.setPositions(pos);
      const mat = new THREE.LineMaterial({ color:HALO_COLOR, linewidth:haloW, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, fog:false });   // sits exactly ON the spiral and marks specific months — fogging half a highlight would misstate the span
      mat.resolution.set(SW, SH);
      const line = new THREE.Line2(geo, mat); line.frustumCulled=false; line.renderOrder=2; line.visible=false; scene.add(line);
      return { line, mat, a, b, ip: geo.attributes.instanceStart.data };
    }).filter(Boolean);
  }

  // current-year label travelling with the glowing spiral head
  const headYear = makeHeadYearSprite(); headYear.visible=false; scene.add(headYear);

  // dynamic stats
  const li0=N-1; const peak = vals.reduce((p,v,i)=> v>vals[p]?i:p, 0);
  G = { data, N, vals, baseX, baseZ, yFull, spiral, spiralGeo, spiralMat, instPos, rings, ringLabels, monthSprites,
        decadeLabels, decadeOrder, decadeTicks, decadeSpine, spineSegs, yearAxis, yearAxisAz:AZ,
        co2Axis, co2AxisAz:AZ, co2Trend, co2TrendIce, co2Head, co2Scale, co2Grid, co2Lo, co2Hi,
        axisMats:[spineMat, tickMat].concat(co2Trend?[co2Trend.m, co2TrendIce.m, co2Scale.m, co2Grid.major.m, co2Grid.minor.m]:[]), guideCyls, parisRings, parisCyls,
        glow, head, headYear, events, ninos, ninoBands, lastKy:-1, lastFlat:-1, padFloor, padCeil, peak, INNER, RSPAN,
        // horizontal radius of the outermost FOGGED shape (the month ring; the guide cylinders and
        // scale rings sit inside it at rho(padCeil)). updateFog() fits the fog range to this, so the
        // cue keeps the same strength when the dataset or the Höhe slider changes the geometry.
        fogR: monthR };
  spiralMat.linewidth = parseFloat(document.getElementById("lineWidth").value);  // keep user's line width across rebuilds
  buildCylToggles();
  updateParisAvail();
  updateOverlay();
  if(keepView){ controls.target.set(0, HFUN*0.45, 0); controls.update(); } else resetView();
}

function fmtSigned(v){ return (v>=0?"+":"−")+Math.abs(v).toFixed(2).replace(".",decSep()); }
// slider readouts: Dezimaltrennzeichen kommt aus I18N[lang].dec — kept in sync with the language switch
function decSep(){ return langDict(LANG).dec; }
function fmtSpeedVal(v){ return v.toFixed(2).replace(/0$/,"").replace(".", decSep()); }
function renderSliderVals(){
  document.getElementById("spdVal").textContent = fmtSpeedVal(parseFloat(document.getElementById("speed").value)) + "×";
  document.getElementById("lwVal").textContent  = parseFloat(document.getElementById("lineWidth").value).toFixed(1).replace(".", decSep());
  document.getElementById("hgtVal").textContent = parseFloat(document.getElementById("height").value).toFixed(1).replace(".", decSep());
}
function updateOverlay() {
  const DS=DATASETS[DSKEY], T=langDict(LANG), d=G.data;
  const sY=d[0][0], eY=d[d.length-1][0];
  document.getElementById("title").textContent = pick(DS.region) + " " + sY + "–" + eY;
  document.getElementById("caption").textContent = pick(DS.source) + "  ·  " + (DS.smooth>1 ? T.smoothed : T.monthly) + "  ·  " + fmtRetrieved(LANG);
  // collapsed handle (narrow viewports): the provenance itself, so the folded state is never blank.
  // Same DS.source string as the caption's first segment — bilingual by construction, no second copy.
  document.getElementById("srcToggleTxt").textContent = pick(DS.source);
}

// ---- depth cue: refit the fog range to the scene and the camera, every frame ----
// No hardcoded distances: the Höhe slider rebuilds the funnel, the dataset changes its radius, and
// OrbitControls changes the camera distance continuously, so any fixed near/far would drift — zoom
// in and the cue vanishes, zoom out and the far half goes black. Instead the range is solved from
// the fogged geometry's own bounding cylinder (radius G.fogR, height HFUN, on the spiral's axis) as
// seen from where the camera actually is:
//   near = view depth of that cylinder's NEAREST point  -> fog 0 there
//   far  = solved so its FARTHEST point lands on exactly DEPTH_CUE_STRENGTH
// so the constant is a perceptual strength, not a distance, and it holds under zoom and orbit.
// The half-depth term uses the camera's forward axis: the horizontal radius counts only as far as
// the view is horizontal, the funnel height only as far as the view looks down. In top-down both
// terms go to zero (f2 collapses the height, the forward axis has no horizontal part), far runs off
// to infinity and the fog fades out on its own — correct, because a flattened disc has no depth
// ordering left to disambiguate, and it keeps the range from degenerating.
function updateFog(cam, f2) {
  if (!scene.fog) return;
  const R = (G && G.fogR) ? G.fogR : 3.6, halfH = HFUN * Math.max(0, f2) * 0.5;
  cam.getWorldDirection(_fogFwd);
  const dx = -cam.position.x, dy = halfH - cam.position.y, dz = -cam.position.z;
  const dCentre = dx*_fogFwd.x + dy*_fogFwd.y + dz*_fogFwd.z;          // view depth of the cylinder's centre
  const span = R*Math.hypot(_fogFwd.x, _fogFwd.z) + halfH*Math.abs(_fogFwd.y);   // its half-extent along that axis
  const near = dCentre - span;
  scene.fog.near = near;
  scene.fog.far  = (FOG_T > 1e-4 && span > 1e-4) ? near + 2*span/FOG_T : near + 1e6;
}

function updateFrame(t) {
  const g=G, T=langDict(LANG);
  const buildP=1-Math.pow(1-clamp01(t),BUILD_DECAY);
  const nVisible=Math.max(1,Math.min(g.N,1+Math.round(buildP*(g.N-1))));
  const li=nVisible-1;
  // 2D flatten: collapse the funnel height toward a flat top-down disc
  if(flat2D !== g.lastFlat){ const a=g.instPos.array, yF=g.yFull, f=1-flat2D;
    for(let i=0;i<g.N-1;i++){ a[6*i+1]=yF[i]*f; a[6*i+4]=yF[i+1]*f; }
    g.instPos.needsUpdate=true;
    if(g.ninoBands) for(const bd of g.ninoBands){ const ba=bd.ip.array; for(let k=0;k<bd.b-bd.a;k++){ const i=bd.a+k; ba[6*k+1]=yF[i]*f; ba[6*k+4]=yF[i+1]*f; } bd.ip.needsUpdate=true; }
    g.lastFlat=flat2D; }
  const f2 = 1-flat2D, in2D = flat2D > 0.5;
  updateFog(camera, f2);   // depth cue — here, not in loop(), so the snapshot camera gets it too
  const tanF = Math.tan(camera.fov*DEG/2)*2;   // for screen-size normalisation of labels (px -> world height at distance)
  g.spiral.visible = nVisible>=2;
  g.spiralGeo.instanceCount = Math.max(0, nVisible-1);   // reveal full-height funnel bottom-up
  g.head.position.set(g.baseX[li], g.yFull[li]*f2, g.baseZ[li]);
  g.glow.position.set(g.baseX[li], g.yFull[li]*f2, g.baseZ[li]);
  g.head.material.opacity=1; g.glow.material.opacity=0.55;
  // current year travels with the glowing head (part of the "Jahresmarken" toggle)
  if(g.headYear){ g.headYear.visible=showYears;
    if(showYears){ setHeadYear(g.headYear, g.data[li][0]); g.headYear.position.copy(g.head.position);
      const hd=camera.position.distanceTo(g.head.position), wh=(30/SH)*hd*tanF;
      g.headYear.scale.set(wh*g.headYear.userData.aspect, wh, 1); } }
  const ringDim = parisMode ? 0.32 : 1;   // Paris on → fade the 1951-1980 rings to a faint reference so the Paris rings dominate
  for(const r of g.rings){ r.l.visible=showRings; r.l.material.opacity=showRings?r.base*ringDim:0; r.l.material.depthTest=!in2D; r.l.renderOrder=in2D?4:2; }
  for(const sp of g.ringLabels){ sp.visible=showRings; sp.material.opacity=parisMode?0.4:0.95; }
  for(const sp of g.monthSprites) sp.material.opacity=0.9;
  // time axis: reveal decade markers up to the current build height
  // pin each column to a fixed screen side so its labels stay put & readable while the spiral turns
  // (good for screenshots): years to screen-LEFT (camAzimuth − 90°), CO2 to screen-RIGHT (+ 90°).
  if(g.yearAxis) g.yearAxis.rotation.y = controls.getAzimuthalAngle() - Math.PI/2 - g.yearAxisAz;
  if(g.co2Axis)  g.co2Axis.rotation.y  = controls.getAzimuthalAngle() + Math.PI/2 - g.co2AxisAz;
  const topY=g.yFull[li]; let reached=0;
  // decade labels: uniform screen size + tier-aware decluttering — keeps the 10-yr cadence wherever it physically fits
  { const Hpx=SH, ry=g.yearAxis.rotation.y, cosR=Math.cos(ry), sinR=Math.sin(ry), taken=[];
    for(const dl of g.decadeOrder){
      const lp=dl.position;
      _tmp.set(lp.x*cosR+lp.z*sinR, lp.y, -lp.x*sinR+lp.z*cosR);   // the axis group rotates about Y at the origin
      const dist=camera.position.distanceTo(_tmp);
      const wh=(dl.userData.px/Hpx)*dist*tanF; dl.scale.set(wh*dl.userData.aspect, wh, 1);
      _tmp.project(camera); const sy=(0.5-_tmp.y*0.5)*Hpx;
      if(dl.userData.y>topY+0.18){ dl.userData.hide=false; continue; }   // not yet revealed by the build: claims no slot
      dl.userData.hide = taken.some(t=>Math.abs(t-sy)<dl.userData.px*0.62);   // glyphs fill ~44% of the sprite — allow near-touching labels before thinning
      if(!dl.userData.hide) taken.push(sy); } }
  for(const dl of g.decadeLabels){ dl.material.opacity=clamp01((topY-dl.userData.y+0.12)/0.3)*0.9*f2; dl.visible=showYears&&f2>0.01&&!dl.userData.hide; if(dl.userData.y<=topY+1e-3) reached++; }
  g.decadeTicks.geometry.instanceCount=reached;
  g.decadeSpine.geometry.instanceCount=Math.max(0, Math.round((topY/HFUN)*g.spineSegs));
  g.decadeTicks.material.opacity=0.7*f2; g.decadeSpine.material.opacity=0.4*f2;
  g.decadeTicks.visible=showYears&&f2>0.01; g.decadeSpine.visible=showYears&&f2>0.01;  // year-marks toggle (hidden in 2D top-down)
  // CO2 curve: same reveal rule as the decade spine (grow with the build), same 2D rule as the
  // year axis (height==time collapses in top-down, so a time-indexed curve is meaningless there).
  if(g.co2Trend){
    const on=showCO2 && f2>0.01;
    for(const part of [g.co2Trend, g.co2TrendIce]){
      const shown=Math.max(0, Math.min(part.segs, li-part.from));
      part.l.geometry.instanceCount=shown;
      part.l.visible=on && shown>0;
    }
    g.co2Trend.m.opacity=0.95*f2; g.co2TrendIce.m.opacity=0.95*f2;
    // ppm reference scale at the foot: follows the curve's own show/hide rules exactly
    if(g.co2Scale){ g.co2Scale.l.visible=on; g.co2Scale.m.opacity=0.55*f2;
      for(const sp of g.co2Scale.labels){ sp.visible=on; sp.material.opacity=0.9*f2; } }
    // vertical ppm grid: same show/hide rules as the rest of the strip, and the same bottom-up
    // reveal as the decade spine — the grid rises with the curve instead of pre-drawing the endpoint
    if(g.co2Grid){ const rows=Math.max(0, Math.round((topY/HFUN)*g.co2Grid.segs));
      for(const gr of [g.co2Grid.major, g.co2Grid.minor]){
        gr.l.geometry.instanceCount=rows*gr.lines; gr.l.visible=on&&rows>0; gr.m.opacity=gr.base*f2; } }
    // head readout rides the tip: same height as the spiral head, at the curve's current radius
    const ppm=CO2[Math.min(li, CO2.length-1)][2];
    setCO2Head(g.co2Head, ppm);
    g.co2Head.visible=on;
    if(on){
      const rNow=g.co2Head.userData.rOf(ppm);
      g.co2Head.position.set(rNow*Math.sin(g.co2AxisAz), g.yFull[li], rNow*Math.cos(g.co2AxisAz));
      // screen-size normalised at its OWN distance (36px, a touch above the 34px century labels) —
      // the CO2 group rotates about Y at the origin, so undo that before measuring
      const ry=g.co2Axis.rotation.y, cR=Math.cos(ry), sR=Math.sin(ry), hp=g.co2Head.position;
      _tmp.set(hp.x*cR+hp.z*sR, hp.y, -hp.x*sR+hp.z*cR);
      const wh=(36/SH)*camera.position.distanceTo(_tmp)*tanF;
      g.co2Head.scale.set(wh*g.co2Head.userData.aspect, wh, 1);
    }
  }
  for(const gc of g.guideCyls){ gc.m.scale.set(1, Math.max(0.001, topY*f2), 1); gc.m.position.y=topY*0.5*f2; gc.m.visible=cylOn.has(gc.v)&&f2>0.5; }  // guide walls grow with build, hidden in 2D
  if(g.parisCyls) for(const pc of g.parisCyls){ pc.m.scale.set(1, Math.max(0.001, topY*f2), 1); pc.m.position.y=topY*0.5*f2; pc.m.visible=parisCylOn.has(pc.v)&&f2>0.5; }
  // event / El-Niño callouts: uniform HTML labels stacked in a margin column (newest on top), thin SVG leaders to the dots
  if(g.events||g.ninos){ const W=SW, H=SH, gl=DSKEY==="global";
    const items=[];
    for(const pool of [[g.events,showEvents],[g.ninos,showElNino]]){ const arr=pool[0], reveal=gl&&pool[1]; if(!arr) continue;
      for(const ev of arr){ const on=reveal&&ev.i<=li;
        ev.dot.visible=on; ev.el.style.visibility=on?"visible":"hidden"; ev.path.style.display=on?"":"none";
        if(!on) continue;
        const px=g.baseX[ev.i], py=g.yFull[ev.i]*f2, pz=g.baseZ[ev.i];
        ev.dot.position.set(px,py,pz); ev.dot.material.opacity=1;
        _tmp.set(px,py,pz).project(camera);
        items.push({ ev, tx:(_tmp.x*0.5+0.5)*W, ty:(0.5-_tmp.y*0.5)*H }); } }
    if(items.length){
      // order by projected anchor height, not by year: leaders fan out order-preserving and stop crossing
      // where the month azimuth inverts the screen order (e.g. Jan 2026 projecting below Feb 2024 on the tilted rim).
      // hysteresis: near-equal anchors keep their previous order so the column doesn't flicker while the spiral turns
      items.sort((a,b)=> (Math.abs(a.ty-b.ty)<8 && a.ev.rank!==undefined && b.ev.rank!==undefined) ? a.ev.rank-b.ev.rank : a.ty-b.ty);
      items.forEach((it,idx)=>{ it.ev.rank=idx; });
      for(const it of items){ if(!it.ev.w){ it.ev.w=it.ev.el.offsetWidth; it.ev.h=it.ev.el.offsetHeight; } }
      const gap=(items[0].ev.h||26)+7, colX=W<=640?20:44;   // inset from the window edge: at 18/10 the pills read as clipped rather than placed
      const panelVis=!document.body.classList.contains("panelHidden");
      const minY=panelVis ? document.getElementById("panel").getBoundingClientRect().bottom+16 : 80;
      // lower bound: the bottom-left footer block now shares this margin column, so stop above it.
      // stackYs works in pill CENTRES, hence the half-height term — without it the last pill's box
      // still dips into the block by half its height.
      const fbTop=document.getElementById("footer").getBoundingClientRect().top;
      const ys=stackYs(items.map(it=>it.ty), gap, Math.max(60,minY), Math.min(H-130, fbTop-12-(items[0].ev.h||26)/2));
      for(let k=0;k<items.length;k++){ const it=items[k], y=ys[k], ev=it.ev;
        ev.el.style.transform="translate("+colX+"px,"+Math.round(y-ev.h/2)+"px)";
        const x0=colX+ev.w+6;
        ev.path.setAttribute("d","M"+x0+" "+Math.round(y)+" L"+(x0+14)+" "+Math.round(y)+" L"+Math.round(it.tx)+" "+Math.round(it.ty)); } } }
  // Super-El-Niño span halos: light up an event's ONI>=1.0 arc once the build has drawn past it
  if(g.ninoBands){ const on0=DSKEY==="global"&&showElNino; for(const bd of g.ninoBands){ const on=on0&&li>=bd.b; bd.line.visible=on; bd.mat.opacity=on?HALO_OPACITY:0; } }
  // readout
  const yr=g.data[li][0], mo=g.data[li][1], val=g.vals[li];
  const pkd=g.data[g.peak], pkv=g.vals[g.peak];
  if(g.parisRings) for(const pr of g.parisRings){ const on=parisMode; pr.l.visible=on; pr.l.material.opacity=on?0.85:0; pr.l.material.depthTest=!in2D; pr.l.renderOrder=in2D?4:2; pr.lab.visible=on; pr.lab.material.opacity=on?0.95:0; }
  const preind = (parisMode && DSKEY==="global") ? ("   ·   " + fmtSigned(val+PARIS_OFFSET) + " °C " + T.preind) : "";
  // Der Höchstwert steht bewusst NICHT hier: er beschreibt die ganze Reihe, während beide Zahlen in
  // dieser Zeile denselben angezeigten Monat meinen (GISTEMP-Basis und vorindustriell umgerechnet).
  // Dazwischengeschoben las man "ggü. vorindustriell" als Zusatz zum Rekord. Er lebt jetzt im Fußblock.
  document.getElementById("readout").textContent =
    T.months[mo-1] + " " + yr + "   " + fmtSigned(val) + " °C" + preind;
  document.getElementById("record").textContent =
    T.record + " " + fmtSigned(pkv) + " °C (" + T.months[pkd[1]-1] + " " + pkd[0] + ")";
  document.getElementById("tlabel").textContent = yr;
}

function autoCamera(k) {
  const elev=lerp(86*DEG, 32*DEG, k), dist=lerp(13, 22, k), ty=lerp(0, HFUN*0.5, k);
  const horiz=dist*Math.cos(elev), vert=dist*Math.sin(elev);
  const az = (tNorm>T_TILT_END ? (tNorm-T_TILT_END)/(1-T_TILT_END) : 0) * 0.5;
  camera.position.set(-horiz*Math.sin(az), ty+vert, -horiz*Math.cos(az));
  camera.up.set(0,1,0); camera.lookAt(0,ty,0);
  controls.target.set(0,ty,0);
}
// drop out of top-down immediately (no morph) — used by every path that wants to own the 3D camera again
function leave2D(){
  if(flat2D<=0 && flat2DTarget<=0) return;
  flat2D=0; flat2DTarget=0; poleAuto=false; exit2DDone();
  const b=document.getElementById("view2dBtn"); if(b) b.classList.remove("on");
}
function resetView() {
  leave2D(); sideCancel();
  setAutoCam(true);
  controls.target.set(0, HFUN*0.45, 0);
  const elev = 32*DEG, dist = (11 + HFUN) * frameScale();   // narrow box -> back off so both axes fit
  camera.position.set(0, HFUN*0.45 + dist*Math.sin(elev), -dist*Math.cos(elev));
  camera.up.set(0,1,0); controls.update();
}
// NOTE: OrbitControls must stay enabled at all times, otherwise it ignores input and the
// "start" event (which flips us out of auto-cam) never fires -> mouse would appear dead.
function setAutoCam(on){ autoCam=on; const b=document.getElementById("camBtn"); b.textContent=langDict(LANG)[on?"auto":"free"]; b.classList.toggle("on",on); }

// ---- level side view: kill the CO2 strip's perspective distortion ----
// The strip is a vertical plane in the scene, so its 250->450 ppm span projects WIDER the further a
// point sits from the camera's own height. Measured at 1280x800 in the default view: 57.7 px at y=0,
// 64.2 px at y=4, 72.4 px at y=8 — the recent steep rise, which sits at the TOP, gets ~25 % more
// travel than it earned. The distortion is exactly zero when the
// camera's forward vector is horizontal, because then every height on the strip is at the same depth.
// So: keep x/z (azimuth and distance from the vertical axis are preserved to the digit), drop the
// camera to the strip's mid-height and look level at it. Sibling of Draufsicht — same easing, same
// duration, same idea: an admitted geometric distortion gets a switch rather than a disclaimer.
const SIDE_DUR_S = MORPH_MANUAL_S;   // deliberately the manual 2D morph duration; these two are the same gesture
let sideT = -1;                      // >=0 while the move animates (seconds elapsed); -1 = idle
const sideFrom = new THREE.Vector3(), sideTo = new THREE.Vector3();
const sideLookFrom = new THREE.Vector3(), sideLookTo = new THREE.Vector3(), _sideLook = new THREE.Vector3();
function sideCancel(){ sideT = -1; const b=document.getElementById("sideBtn"); if(b) b.classList.remove("on"); }
function sideView(){
  leave2D();                          // height==time is collapsed in top-down; the strip isn't even drawn there
  if(autoCam) setAutoCam(false);      // an auto-spin would drift the level view away again
  const mid = HFUN/2;                 // the strip spans y 0..HFUN, and its MIDDLE is the distortion-free height
  // Normally: keep x/z verbatim, so azimuth and distance from the axis are preserved to the digit.
  // But the top-down camera sits ON the axis (x,z ~ 0.001) and so does anything near the pole — dropping
  // THAT to mid-height would park the camera inside the funnel looking at nothing. So when the camera is
  // closer to the axis than the strip's own outer edge, there is no "current distance" worth keeping:
  // rebuild x/z from the azimuth OrbitControls still holds (it survives the top-down lock unchanged) at
  // resetView's default distance.
  const rNow = Math.hypot(camera.position.x, camera.position.z);
  const rStrip = (G && G.co2Head) ? G.co2Head.userData.rOf(G.co2Hi) : 6;
  sideFrom.copy(camera.position); sideLookFrom.copy(controls.target);
  if (rNow > rStrip) sideTo.set(camera.position.x, mid, camera.position.z);
  else { const az=controls.getAzimuthalAngle(), r=(11+HFUN)*frameScale(); sideTo.set(r*Math.sin(az), mid, r*Math.cos(az)); }
  sideLookTo.set(0, mid, 0);
  sideT = 0;
  document.getElementById("sideBtn").classList.add("on");
}
// runs after controls.update() so it owns the camera for the duration of the move
function stepSideView(dt){
  sideT += dt;
  const e = easeInOut(Math.min(1, sideT/SIDE_DUR_S));
  camera.position.lerpVectors(sideFrom, sideTo, e);
  controls.target.copy(_sideLook.lerpVectors(sideLookFrom, sideLookTo, e));
  camera.up.set(0,1,0); camera.lookAt(_sideLook);
  if(sideT >= SIDE_DUR_S) sideT = -1;   // done — hand the camera back to OrbitControls, keep the button lit
}
// the "on" state is a claim about the CURRENT camera, not a mode: as soon as the view tilts off level
// (drag, auto-snap, Draufsicht, reset) the claim is false and the light goes out.
function sideStateCheck(){
  const b=document.getElementById("sideBtn");
  if(!b || !b.classList.contains("on") || sideT>=0) return;
  if(Math.abs(controls.getPolarAngle() - Math.PI/2) > 1.5*DEG) b.classList.remove("on");
}

// ---- 2D top-down (near-orthographic) view ----
function toggle2D(on, auto=false){
  if(on) sideCancel();                   // top-down takes the camera; a running level move would fight it
  flat2DTarget = on ? 1 : 0;
  morphDur = auto ? MORPH_AUTO_S : MORPH_MANUAL_S;
  document.getElementById("view2dBtn").classList.toggle("on", on);
  if (on && !auto) {                       // manual/button path: grab the camera and lock the orbit straight overhead
    cam2DLocked = true;
    cam2DFrom.copy(camera.position); cam2DLookFrom.copy(controls.target);
    if(autoCam) setAutoCam(false);
    controls.enableRotate=false; controls.enableZoom=false; controls.enablePan=false; controls.autoRotate=false;
  } else if (on && auto) {                  // auto path: flatten only — leave the camera to the user (they steered to the pole; let them tilt back out)
    if(autoCam) setAutoCam(false);
  }
  // turning off: keep cam2DLocked until the morph reaches flat2D==0, where exit2DDone() clears it (so the button's exit stays animated)
}
function exit2DDone(){ cam2DLocked=false; camera.up.set(0,1,0); camera.fov=45; camera.updateProjectionMatrix();
  controls.enableRotate=true; controls.enableZoom=true; controls.enablePan=true; }
document.getElementById("view2dBtn").onclick = () => {
  toggle2D(flat2DTarget===0);              // manual toggle (button)
  poleAuto = false; autoArmed = false;     // manual choice wins; don't let the auto-snap fight it until the user tilts clearly away from the pole
};
// remaining tilt (deg) from the camera direction to the nearest pole (straight down OR straight up)
function poleGapDeg(){ const p = controls.getPolarAngle()/DEG; return Math.min(p, 180-p); }
// auto pole-snap: each frame, read the tilt and morph into / out of the SAME top-down state the button uses (hysteresis via autoArmed)
function updateAutoTopDown(){
  if (cam2DLocked) return;                  // the button's overhead camera owns the view; the auto-snap stays out of its way
  const gap = poleGapDeg();
  if (!poleAuto){                           // currently 3D (or auto-off)
    if (gap > AUTO_EXIT_DEG) autoArmed = true;                         // clearly away from the pole -> re-arm the snap
    if (autoArmed && gap < AUTO_ENTER_DEG){ poleAuto = true; autoArmed = false; toggle2D(true, true); }   // tilted into the pole zone -> snap in
  } else if (gap > AUTO_EXIT_DEG){          // was auto-snapped, now tilted back out past the release threshold -> return to 3D
    poleAuto = false; toggle2D(false, true);
  }
}

// ---- snapshot: high-res PNG of the current view at full build, with caption + branding ----
function snapshot(){
  // capture EXACTLY what's on screen now (current scrub position, camera/mode, toggles, background) into a 9:16 phone card
  const W=1620, H=2880;   // 9:16 portrait
  const setRes=(w,h)=>{ G.spiralMat.resolution.set(w,h); G.rings.forEach(r=>r.l.material.resolution.set(w,h)); if(G.parisRings) G.parisRings.forEach(p=>p.l.material.resolution.set(w,h)); if(G.ninoBands) G.ninoBands.forEach(b=>b.mat.resolution.set(w,h)); G.axisMats.forEach(m=>m.resolution.set(w,h)); };
  const in2D = flat2D > 0.5;
  const sceneH = in2D ? 1620 : 2350;        // 2D: square (round disc); 3D: tall area so the funnel fills the card
  const sceneY = in2D ? Math.round((H - sceneH)/2) : 350;   // 3D: leave room up top for the title + reading block
  const prevPR=renderer.getPixelRatio(), prevAspect=camera.aspect, prevFov=camera.fov;
  // thicken the vector lines so they read the same at this higher capture resolution
  const lwScale = (SH>0) ? Math.max(1, Math.min(5, sceneH/SH)) : 2;
  const lwMats = [G.spiralMat].concat(G.rings.map(r=>r.l.material), G.parisRings?G.parisRings.map(p=>p.l.material):[], G.ninoBands?G.ninoBands.map(b=>b.mat):[], G.axisMats);
  const lwOrig = lwMats.map(m=>m.linewidth);
  lwMats.forEach(m=>{ m.linewidth *= lwScale; });
  const prevShowYears = showYears; showYears = false;   // the year axis sits off to the side and crops in portrait — hide it for the card
  const prevShowCO2 = showCO2; showCO2 = false;         // same for the CO2 column on the other side — the card carries the ppm VALUE as a text line instead
  camera.aspect = W/sceneH; camera.updateProjectionMatrix();
  renderer.setClearColor(0x000000, 1);      // OPAQUE black so additive layers (cylinders, glow, comet-head) are captured cleanly
  renderer.setPixelRatio(1); renderer.setSize(W,sceneH,false); setRes(W,sceneH);
  updateFrame(tNorm); renderer.render(scene,camera);        // current state, no forced full-build
  const sceneURL=renderer.domElement.toDataURL("image/png");
  // project the visible event/El-Niño anchors with the snapshot camera, so the callout column can be drawn onto the card
  const buildPS=1-Math.pow(1-clamp01(tNorm),BUILD_DECAY), liS=Math.max(1,Math.min(G.N,1+Math.round(buildPS*(G.N-1))))-1, f2S=1-flat2D;
  const annotItems=[];
  if(DSKEY==="global") for(const pool of [[G.events,showEvents,"rgba(216,162,74"],[G.ninos,showElNino,"rgba(79,195,214"]]){
    const arr=pool[0]; if(!arr||!pool[1]) continue;
    for(const ev of arr){ if(ev.i>liS) continue;
      _tmp.set(G.baseX[ev.i], G.yFull[ev.i]*f2S, G.baseZ[ev.i]).project(camera);
      annotItems.push({ i:ev.i, text:ev.el.textContent, acc:pool[2], tx:(_tmp.x*0.5+0.5)*W, ty:(0.5-_tmp.y*0.5)*sceneH+sceneY }); } }
  // restore the live view
  renderer.setClearColor(0x000000, 0);
  lwMats.forEach((m,i)=>{ m.linewidth = lwOrig[i]; });
  showYears = prevShowYears;
  showCO2 = prevShowCO2;
  camera.fov=prevFov; camera.aspect=prevAspect; camera.updateProjectionMatrix();
  renderer.setPixelRatio(prevPR); renderer.setSize(SW,SH,false); setRes(renderer.domElement.width,renderer.domElement.height); updateFrame(tNorm);
  // composite into the portrait card (background matches the current Glow/Black setting)
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  const black=!!(document.querySelector('#bgRow button[data-bg="black"]')||{}).classList?.contains("on");
  if(black){ x.fillStyle="#000"; x.fillRect(0,0,W,H); }
  else { const grd=x.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,H*0.62); grd.addColorStop(0,"#17130C"); grd.addColorStop(0.52,"#0C0B09"); grd.addColorStop(1,"#060504"); x.fillStyle=grd; x.fillRect(0,0,W,H); }
  const img=new Image();
  img.onload=()=>{
    x.globalCompositeOperation="lighter";   // add the black-bg scene onto the card background (like the live additive glow)
    x.drawImage(img, 0, sceneY, W, sceneH);
    x.globalCompositeOperation="source-over";
    const T=langDict(LANG), DS=DATASETS[DSKEY], d=G.data;
    const buildP=1-Math.pow(1-clamp01(tNorm),BUILD_DECAY), li=Math.max(1,Math.min(G.N,1+Math.round(buildP*(G.N-1))))-1, val=G.vals[li];
    x.textAlign="center";

    x.fillStyle="#E8E4DD"; x.font=`700 56px ${activeFontStack()}`; x.fillText(pick(DS.region), W/2, 135);
    x.fillStyle="#A8A29E"; x.font=`500 34px ${activeFontStack()}`; x.fillText(d[0][0]+"–"+d[d.length-1][0], W/2, 188);
    x.fillStyle="#E8E4DD"; x.font='600 50px "IBM Plex Mono", monospace'; x.fillText(T.months[d[li][1]-1]+" "+d[li][0]+"   "+fmtSigned(val)+" °C", W/2, 262);
    // CO2 reading for the SAME month — the curve itself is dropped from the card (the year axis is
    // hidden for portrait crop), so the value carries the statement instead.
    const co2Row = CO2[Math.min(li, CO2.length-1)];
    x.fillStyle=CO2_CSS; x.font='600 42px "IBM Plex Mono", monospace';
    x.fillText(Math.round(co2Row[2])+" ppm CO₂", W/2, 318);
    x.fillStyle="#A8A29E"; x.font='400 28px "IBM Plex Mono", monospace'; x.fillText(pick(DS.source) + "  ·  " + fmtRetrieved(LANG), W/2, 368);
    // bottom block: brand
    x.fillStyle="#D8A24A"; x.font='600 32px "Fira Sans", sans-serif'; x.fillText("AETERNA LABS", W/2, H-120);
    x.fillStyle="#78716C"; x.font='400 26px "IBM Plex Mono", monospace'; x.fillText("climate.aeternalabs.io", W/2, H-78);
    // margin-column callouts — same treatment as the live view, drawn crisp at card resolution

      annotItems.sort((a,b)=>a.ty-b.ty);   // same anchor-height ordering as the live column
      const fpx=34, padX=19, ph=54, colX=56;
      x.font=`600 ${fpx}px ${activeFontStack()}`;

      const ys=stackYs(annotItems.map(it=>it.ty), ph+10, 400, H-210);

      a.download="klimaspirale_"+d[li][0]+"-"+String(d[li][1]).padStart(2,"0")+".png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }, "image/png");
  };

}

// ---- main loop ----
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (playing) { tNorm += dt*0.02*speed; if (tNorm>=1){ tNorm=1; setPlaying(false); } document.getElementById("scrub").value=tNorm; }
  if (hgtDirty) { buildScene(true); hgtDirty=false; }   // rebuild at most once per frame on height changes
  if (flat2D !== flat2DTarget) {
    const step = dt/morphDur;                              // 3D<->top-down morph (manual ~0.9 s, auto pole-snap ~1.5 s)
    flat2D += (flat2DTarget>flat2D ? step : -step); flat2D = clamp01(flat2D);
    if (flat2D===0 && flat2DTarget===0) exit2DDone();
  }
  updateFrame(tNorm);
  if (flat2D > 0.0001 && cam2DLocked) {                    // BUTTON path only: drive camera straight overhead, near-orthographic
    const e = easeInOut(flat2D);
    camera.fov = lerp(45, 9, e);
    camera.position.lerpVectors(cam2DFrom, cam2DTo, e);
    camera.up.set(0, 1-e, e).normalize();                 // ease the roll (up Y->Z) instead of pinning it -> no sideways flip on the way back
    camera.lookAt(_camLook.lerpVectors(cam2DLookFrom, CAM2D_LOOK, e));  // ease the look point (3D target -> disc centre) so controls.update() takes over seamlessly at flat2D==0
    camera.updateProjectionMatrix();
  } else {
    controls.autoRotate = autoCam;     // "Auto" = gentle auto-spin; user drag still works any time
    controls.update();                 // keeps OrbitControls (and getPolarAngle) live in 3D AND during auto top-down
    if (sideT >= 0) stepSideView(dt);  // level side-view move overrides update() while it runs
    updateAutoTopDown();               // read the fresh tilt and (un)snap the auto pole-top-down
    sideStateCheck();                  // the side-view light only stays on while the camera is still level
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// background: transparent renderer means the CSS body background is what shows behind the scene
const BG = { glow:"radial-gradient(125% 95% at 50% 36%, #17130C 0%, #0C0B09 52%, #060504 100%)", black:"#000000" };
function setBg(mode){ document.body.style.background = BG[mode] || BG.glow;
  document.querySelectorAll("#bgRow button").forEach(x=>x.classList.toggle("on", x.dataset.bg===mode)); }
document.querySelectorAll("#bgRow button").forEach(b => b.onclick = () => setBg(b.dataset.bg));
// Paris-rings toggle (pre-industrial reference) — only meaningful for the global series
function setParis(on){ parisMode = on && DSKEY==="global"; document.getElementById("parisBtn").classList.toggle("on", parisMode); updateParisNote(); }
function updateParisAvail(){ const ok=DSKEY==="global";
  for(const id of ["parisBtn","eventsBtn","elninoBtn"]){ const b=document.getElementById(id); if(!b) continue; b.disabled=!ok; b.style.opacity=ok?"":"0.4"; b.style.cursor=ok?"":"not-allowed"; }
  if(!ok){ parisMode=false; const pb=document.getElementById("parisBtn"); if(pb) pb.classList.remove("on");
    showEvents=false; const eb=document.getElementById("eventsBtn"); if(eb) eb.classList.remove("on");
    showElNino=false; const nb=document.getElementById("elninoBtn"); if(nb) nb.classList.remove("on"); } }
document.getElementById("parisBtn").onclick = () => setParis(!parisMode);
document.getElementById("eventsBtn").onclick = () => { showEvents = DSKEY==="global" && !showEvents; document.getElementById("eventsBtn").classList.toggle("on", showEvents); };
document.getElementById("elninoBtn").onclick = () => { showElNino = DSKEY==="global" && !showElNino; document.getElementById("elninoBtn").classList.toggle("on", showElNino); };
document.getElementById("co2Btn").onclick = () => { showCO2 = !showCO2;
  document.getElementById("co2Btn").classList.toggle("on", showCO2); updateCO2Note(); };
document.getElementById("sideBtn").onclick = sideView;
// ---- info overlay (baseline & Paris explainer) + Paris context note ----
function renderInfo(){
  const D = infoDict(LANG);
  // Split sections into the numbered reading lane (1–6, a linear chain) and the standalone deep-dive
  // tiles. The predicate is the numbering itself: lane items open with a digit ("1 · …"), tiles do not.
  // Keep the didactic chain numbered and the standalone blocks unnumbered and this stays correct.
  const sec = s => "<div class=\"info-sec\"><h3>"+s.h+"</h3><div class=\"info-p\">"+s.body+"</div></div>";
  const lane  = D.sections.filter(s => /^\s*\d/.test(s.h));
  const tiles = D.sections.filter(s => !/^\s*\d/.test(s.h));
  document.getElementById("infoBody").innerHTML =
    "<h2 id=\"infoTitle\">"+D.title+"</h2><div class=\"info-sub\">"+D.subtitle+"</div>" +
    "<div class=\"info-lane\">"+lane.map(sec).join("")+"</div>" +
    (tiles.length ? "<div class=\"info-tiles\">"+tiles.map(sec).join("")+"</div>" : "") +
    "<div class=\"info-src\">"+D.src+"  ·  "+fmtRetrieved(LANG)+"  ·  CO₂ "+fmtRetrieved(LANG, CO2_RETRIEVED)+"</div>";
  const x=document.getElementById("infoClose"); x.title=D.close; x.setAttribute("aria-label", D.close);
}
function openInfo(){ renderInfo(); document.getElementById("infoOverlay").classList.add("open");
  document.getElementById("infoClose").focus(); }   // A11y: move focus into the dialog on open
function closeInfo(){ const ov=document.getElementById("infoOverlay"); if(!ov.classList.contains("open")) return;
  ov.classList.remove("open"); document.getElementById("infoBtn").focus(); }   // A11y: restore focus to the trigger
function updateParisNote(){ const n=document.getElementById("parisNote"); n.innerHTML=infoDict(LANG).note; n.classList.toggle("show", parisMode); }
function updateCO2Note(){ const n=document.getElementById("co2Note"); n.innerHTML=infoDict(LANG).co2Note; n.classList.toggle("show", showCO2); }
document.getElementById("infoBtn").onclick = openInfo;
document.getElementById("infoClose").onclick = closeInfo;
document.getElementById("infoOverlay").addEventListener("click", e => { if(e.target.id==="infoOverlay") closeInfo(); });
// A11y: light focus trap — the dialog's only focusable control is the close button, so Tab keeps focus there
document.getElementById("infoOverlay").addEventListener("keydown", e => { if(e.key==="Tab"){ e.preventDefault(); document.getElementById("infoClose").focus(); } });
document.getElementById("parisNote").onclick = openInfo;
document.getElementById("co2Note").onclick = openInfo;
addEventListener("keydown", e => { if(e.key==="Escape") closeInfo(); });
function applyI18n(){ document.documentElement.lang=LANG; const T=langDict(LANG);
  document.title = T.docTitle;
  // Font-Stack (zh/ja/ru/uk-Vorbereitung): T.stack setzt/ersetzt die Body-font-family; ohne stack
  // wird ein zuvor gesetzter Wert entfernt, sodass wieder das CSS-Default ("DM Sans" …) greift —
  // damit bleibt der berechnete Font für Latin-Sprachen exakt wie vor dieser Änderung. IBM-Plex-Mono-
  // Readouts (#readout, #tlabel) tragen eigene font-family-Regeln und erben nicht von body, bleiben
  // also unangetastet.
  document.body.style.fontFamily = T.stack || "";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(T[k]) el.textContent=T[k]; });
  document.getElementById("hint").textContent=T.hint;
  document.querySelector("#videoLink a").textContent = T.videoLink;
  // § 5 DDG: Href ist mechanisch aus LANG abgeleitet (nicht Teil von I18N) — nur "de" bekommt die
  // deutsche Impressum/Datenschutz-Seite, jede andere Sprache faellt auf die englische Fassung
  // zurueck. Labels dagegen sind je Sprache uebersetzt.
  { const legalBase = LANG === "de" ? "https://aeternalabs.io/de/" : "https://aeternalabs.io/en/";
    const imprintEl = document.getElementById("legalImprint"), privacyEl = document.getElementById("legalPrivacy");
    imprintEl.href = legalBase + "impressum"; imprintEl.textContent = T.legalImprint;
    privacyEl.href = legalBase + "datenschutz"; privacyEl.textContent = T.legalPrivacy; }
  document.getElementById("camBtn").textContent=T[autoCam?"auto":"free"];
  { const sel=document.getElementById("langSel"); sel.value=LANG; sel.setAttribute("aria-label", T.langLabel); }
  // localized tooltips (title attributes)
  document.getElementById("panelToggle").title = T.titleCollapse;
  document.getElementById("panelOpen").title   = T.titleExpand;
  document.getElementById("elninoBtn").title   = T.elninoTitle;
  document.getElementById("co2Btn").title      = T.co2Title;
  document.getElementById("sideBtn").title     = T.sideviewTitle;
  // A11y: localized aria-labels for the icon-only play button + the four range sliders
  document.getElementById("play").setAttribute("aria-label", T[playing?"ariaPause":"ariaPlay"]);
  document.getElementById("scrub").setAttribute("aria-label", T.ariaScrub);
  document.getElementById("speed").setAttribute("aria-label", T.speed);
  document.getElementById("lineWidth").setAttribute("aria-label", T.linewidth);
  document.getElementById("height").setAttribute("aria-label", T.height);
  renderSliderVals();   // decimal separator follows the language
  setSrcOpen(!_footer.classList.contains("srcCollapsed"));   // re-label the source handle, keep its state
  renderInfo(); updateParisNote(); updateCO2Note();
  setAdvLabel();
}

// callout widths are measured against the live font — re-measure once the webfont has actually loaded
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(G) for(const ev of [...(G.events||[]),...(G.ninos||[])]){ ev.w=0; ev.h=0; } });

resize(); applyI18n(); buildScene(); setPlaying(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
