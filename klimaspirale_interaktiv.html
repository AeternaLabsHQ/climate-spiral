<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Aeterna self-hosted fonts (latin) — no third-party requests */
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:swap;src:url('fonts/dm-sans-latin.woff2') format('woff2');}
  @font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/outfit-latin.woff2') format('woff2');}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/fira-sans-600-latin.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-mono-400-latin.woff2') format('woff2');}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-mono-500-latin.woff2') format('woff2');}

  :root{
    --ink:#E8E4DD; --ink-muted:#A8A29E; --stone:#827B75;
    --copper:#D8A24A; --copper-glow:#E9B863; --on-copper:#0C0B09;
    --glass:rgba(20,18,14,.72); --glass-border:rgba(216,162,74,.16);
  }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink);
    font-family: "DM Sans", "Outfit", system-ui, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none;
    background: radial-gradient(125% 95% at 50% 36%, #17130C 0%, #0C0B09 52%, #060504 100%); }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  .ovl { position: fixed; pointer-events: none; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
  #title { top: 24px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: .2px; }
  /* ---------- bottom-LEFT footer block: source line, wordmark, context notes ----------
     Deliberately NOT bottom-centre. The spiral is centred and its base is a wide ellipse, so
     bottom-centre is exactly where the graphic reaches lowest — a centred footer runs straight
     through the month labels and the outermost ring label. The corners are always free.
     Anchored by its BOTTOM edge, with the two permanent lines last in the DOM: the notes appear and
     disappear with their toggles and grow upward, so caption and wordmark never shift.

     The width follows the play bar. The bar is centred and 560 px wide, so its left edge sits at
     (100vw − 560)/2; subtracting the block's own 24 px inset and a 40 px gap gives
     max-width = 50vw − 344px, capped at 400 px so it never sprawls on a wide screen.
     Change one of those numbers and you must change the other — see #bottom and inBarZone().

     The source line WRAPS to two lines here, by measurement, not by neglect: its ink is 500 px at
     15 px and still 434 px at 13 px, which would push the block's right edge to x=458 at 1280×800 —
     past the spiral's leftmost base furniture at x=459. A one-liner only fits by shrinking the type
     below 13 px or by crowding the graphic. Two left-aligned lines in a corner are the better trade. */
  #footer { position: fixed; left: 24px; bottom: 24px; z-index: 6; display: flex; flex-direction: column;
    align-items: flex-start; gap: 7px; max-width: min(400px, calc(50vw - 344px)); pointer-events: none;
    text-shadow: 0 2px 14px rgba(0,0,0,.9); }
  #caption, #videoLink, #legalLinks { font-size: 15px; line-height: 1.35; color: var(--ink-muted); }
  /* #videoLink/#legalLinks teilen sich die Typografie mit #caption (gemeinsamer Selektor oben, auch
     in der Mobil-Regel), brauchen aber zusaetzlich klickbare Links — #footer selbst hat
     pointer-events:none, siehe #brandmark a fuer dasselbe Muster. */
  #videoLink a, #legalLinks a { color: inherit; text-decoration: none; pointer-events: auto; }
  #videoLink a:hover, #legalLinks a:hover { color: var(--ink); }
  /* Höchstwert liegt bewusst auf der Größe der beiden Hinweiszeilen (12,5 px), nicht auf der der
     Quellenzeile — er gehört zur Erläuterungs-Ebene, nicht zur Herkunftsangabe. Kein Mobil-Override,
     damit er den Hinweisen auch dort gleich bleibt. */
  #record { font-size: 12.5px; line-height: 1.35; color: var(--ink-muted); }
  /* Below ~1200 px the centred bar leaves no corner worth having (at 1000 px the block would be
     156 px wide and the source line would break over four lines). Fall back to sitting above the
     bar, where the block can use its full width again. Bar top = bottom(30) + height(66) = 96 px. */
  @media (max-width: 1199px) {
    #footer { bottom: 106px; max-width: min(400px, 30vw); }
  }
  #readout { top: 64px; left: 0; right: 0; text-align: center; font-size: 15px; color: var(--ink);
             font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
             font-variant-numeric: tabular-nums; }
  /* z-index 8 liegt ueber #footer (6): seit das Panel den Footer ueberdecken darf, muss es auch
     davor gezeichnet werden — sonst steht der Footer-Text obendrauf und backdrop-filter erfasst ihn
     nicht, weil er gar nicht im Backdrop liegt. Unter #infoOverlay (20) bleibt es. */
  #panel { position: fixed; left: 16px; top: 16px; z-index: 8; display: flex; flex-direction: column; gap: 10px;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; min-width: 210px; max-width: 316px; box-shadow: 0 10px 34px rgba(0,0,0,.45); }
  #panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* Ansicht-Block: festes 2-Spalten-Raster statt flex-wrap. Die Paarung pro Zeile ist inhaltlich
     (Ringe / Kamera / Ereignisse / Zusatzmarkierungen), also darf sie nicht von der Panelbreite
     abhaengen — mit wrap klappte die Reihenfolge je nach Labellaenge um. .span2 = volle Breite. */
  #panel .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #panel .grid2 .span2 { grid-column: 1 / -1; }
  /* Zylinder: gleiches Prinzip, aber die Spaltenzahl haengt vom Datensatz ab — buildCylToggles()
     setzt --cyl-cols auf die Zahl der Skalenzylinder, die Paris-Zylinder brechen darunter in eine
     eigene Zeile (.cyl-break). Schmales Padding, weil die Breite aus dem Raster kommt, nicht aus
     dem Label; sonst passen sechs Spalten nicht in die 316px des Panels. */
  #panel .cylGrid { display: grid; grid-template-columns: repeat(var(--cyl-cols, 6), 1fr); gap: 6px; }
  #panel .cylGrid button { padding: 6px 4px; }
  /* "Paris 1,5" passt nicht in eine Spalte, die auf "−0,5" bemessen ist. Zwei Spalten belegen statt
     die Spaltenbreite hochzuziehen: bei 1fr-Spalten wuerde sonst die Mindestbreite des breitesten
     Buttons auf alle sechs durchschlagen und das Raster ueber die Panelbreite hinauswachsen.
     grid-column-end (nicht die Kurzform) — sonst kollidiert der Span mit dem Zeilenumbruch. */
  #panel .cylGrid .cyl-paris { grid-column-end: span 2; }
  #panel .cylGrid .cyl-break { grid-column-start: 1; }
  #panel .lbl { color: var(--stone); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 2px; }
  button { font: inherit; color: var(--ink); background: rgba(232,228,221,.06); border: 1px solid rgba(232,228,221,.14);
    border-radius: 8px; padding: 6px 11px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  button:hover { background: rgba(232,228,221,.13); border-color: rgba(216,162,74,.45); }
  button.on { background: var(--copper); border-color: var(--copper-glow); color: var(--on-copper); font-weight: 600; }
  /* 560 px, not 760: the bar is centred, so every pixel of its width eats into the bottom-left corner
     where the footer block lives. Non-track chrome (play button, year label, padding, gaps) measures
     218 px, leaving a 342 px scrub track — ample for 1758 monthly steps. Kept in sync with
     inBarZone() in JS and with the #footer max-width formula. */
  #bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px; width: min(560px, 88vw);
    display: flex; align-items: center; gap: 12px; background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 10px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 34px rgba(0,0,0,.45); }
  #play { width: 44px; height: 44px; border-radius: 50%; font-size: 17px; flex: 0 0 auto; }
  #scrub { flex: 1; height: 6px; accent-color: var(--copper); cursor: pointer; }
  #tlabel { font-variant-numeric: tabular-nums; min-width: 116px; text-align: right; font-size: 13px; color: var(--ink-muted);
            font-family: "IBM Plex Mono", ui-monospace, monospace; }
  input[type=range] { accent-color: var(--copper); }
  .hint { position: fixed; right: 16px; bottom: 30px; font-size: 11px; color: var(--stone); text-align: right; line-height: 1.5; }
  select { font: inherit; color: var(--ink); background: rgba(232,228,221,.06); border: 1px solid rgba(232,228,221,.14); border-radius: 8px; padding: 5px 8px; }
  .ph-brand { display: flex; flex-direction: column; gap: 1px; }
  .ph-mark { font-family: "Fira Sans", "DM Sans", sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--copper); line-height: 1.1; }
  .ph-mark b { color: var(--ink); font-weight: 600; }
  .ph-sub { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--stone); }
  /* persistent brand wordmark — bottom line of the left footer block, discreet, burns into screenshots
     (matches snapshot brand; the snapshot composes its own brand block, so this position is live-DOM only) */
  #brandmark { font-family: "Fira Sans", "DM Sans", sans-serif; font-weight: 600;
    font-size: 11px; line-height: 1; letter-spacing: 1.6px; text-transform: uppercase; color: var(--stone); }
  #brandmark b { color: var(--copper); font-weight: 600; }
  #brandmark a { color: inherit; text-decoration: none; pointer-events: auto; }
  #brandmark a:hover { color: var(--ink); }
  .ph-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #advToggle { text-align: left; color: var(--stone); background: transparent; border: none; padding: 4px 2px 2px; cursor: pointer; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; }
  #advToggle:hover { color: var(--ink); background: transparent; border: none; }
  #adv { display: flex; flex-direction: column; gap: 10px; }
  /* Kamera und Hintergrund teilen sich eine Zeile — das spart im aufgeklappten Panel eine
     Label+Button-Reihe (~46px) und damit den Scrollbalken auf mittelhohen Fenstern.
     Feste erste Spalte: der Kamera-Button wechselt zwischen "Auto" und "Freihand", ohne
     min-width wuerde der Hintergrund-Block bei jedem Klick seitlich springen. */
  #panel .advPair { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
  #panel .advPair #camBtn { min-width: 92px; }
  #adv.adv-collapsed { display: none; }
  /* collapsible panel */
  /* Height cap: frueher waren hier 300px reserviert, damit das aufgeklappte Panel den Footer-Block
     unten links nicht ueberdeckt. Das war zu teuer bezahlt — das Panel ist halbtransparent und
     geblurrt, eine Ueberdeckung des statischen Footer-Textes ist folgenlos, und einklappen kann man
     es jederzeit. Reserviert bleibt nur die Abspielleiste: sie ist die primaere Steuerung und darf
     nicht unter dem Panel verschwinden. Ihr Fussabdruck sind 96px (66px hoch + 30px Abstand zum
     unteren Rand, gemessen), dazu 8px Luft und die 16px Panel-Position oben = 120px. */
  #panel { transition: transform .28s ease; max-height: calc(100dvh - 120px); overflow-y: auto; }
  #panelHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin: -2px 0 6px; }
  #panelHead #langSel { padding: 4px 9px; font-size: 12px; cursor: pointer; color-scheme: dark; }
  #langSel option { background: #0C0B09; color: var(--ink); }
  #panelToggle { width: 26px; height: 22px; padding: 0; font-size: 15px; line-height: 1; flex: 0 0 auto; }
  body.panelHidden #panel { transform: translateX(-115%); }
  #panelOpen { position: fixed; left: 0; top: 16px; width: 26px; height: 42px; display: none; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--glass-border); border-left: none; border-radius: 0 10px 10px 0; color: var(--copper);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; z-index: 6; font-size: 16px; }
  body.panelHidden #panelOpen { display: flex; }
  /* auto-hiding play bar */
  #bottom { transition: opacity .4s ease, transform .4s ease; }
  #bottom.barHidden { opacity: 0; transform: translateX(-50%) translateY(16px); pointer-events: none; }
  /* info overlay: baseline & Paris explainer */
  /* "?" statt Glyph-Icon: eine Ziffernbreite traegt weniger optisches Gewicht als das fruehere ⓘ,
     darum etwas groesser und halbfett, damit der Button neben "EN" nicht leer wirkt. */
  #infoBtn { padding: 4px 10px; font-size: 14px; font-weight: 600; line-height: 1; flex: 0 0 auto; }
  #infoOverlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(6,5,4,.66); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); padding: 22px; }
  #infoOverlay.open { display: flex; }
  .info-card { position: relative; width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 26px 26px 22px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 22px 60px rgba(0,0,0,.6);
    -webkit-user-select: text; user-select: text; }
  .info-card h2 { font-family: "Outfit","DM Sans",sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .2px; padding-right: 34px; }
  .info-sub { color: var(--ink-muted); font-size: 13px; margin: 3px 0 14px; }
  .info-card h3 { font-size: 13.5px; font-weight: 700; color: var(--copper-glow); margin: 15px 0 5px; letter-spacing: .2px; }
  .info-card .info-p, .info-card li { font-size: 13.5px; line-height: 1.62; color: var(--ink); }
  .info-card ul { margin: 6px 0 0; padding-left: 18px; }
  .info-card li { margin: 4px 0; }
  .info-card b { color: #F4F1EA; font-weight: 600; }
  .info-card em { color: var(--copper-glow); font-style: normal; }
  /* run-in sub-lead: names a sub-topic inline at a paragraph start so a long tile (the CO₂ block)
     stays scannable without a full sub-heading — copper like the h3, but inline, so it adds no height. */
  .info-card .sub { color: var(--copper-glow); font-weight: 600; }
  .info-src { margin-top: 18px; padding-top: 11px; border-top: 1px solid rgba(232,228,221,.1); color: var(--stone); font-size: 11.5px; }
  .info-close { position: absolute; top: 13px; right: 13px; width: 30px; height: 30px; padding: 0; border-radius: 8px; font-size: 17px; line-height: 1; }
  /* overlay layout wrappers (see renderInfo): the numbered chain 1–6 is a single-column reading LANE
     (its steps build on one another, so order must stay linear); the four standalone deep-dive blocks
     are TILES. Base = one column everywhere (mobile + mid widths). The ≥900px block below turns the
     tiles into a 2-col grid and widens the card — that is where the ~3.8× scroll gets cut down. */
  .info-lane, .info-tiles { display: flex; flex-direction: column; }
  .info-sec { min-width: 0; }
  /* context notes: rows of the footer block (see #footer). display:none collapses the row entirely,
     so toggling one never leaves a gap and never moves the lines below it. */
  #parisNote { font-size: 12.5px; line-height: 1.35;
    color: var(--ink-muted); cursor: pointer; display: none; pointer-events: auto; transition: color .15s; }
  #parisNote.show { display: block; }
  #parisNote .info-i { color: var(--copper); font-style: normal; }
  #parisNote:hover { color: var(--ink); }
  #co2Note { font-size: 12.5px; line-height: 1.35;
    color: var(--ink-muted); cursor: pointer; display: none; pointer-events: auto; transition: color .15s; }
  #co2Note.show { display: block; }
  #co2Note .info-i { color: #B56BC4; font-style: normal; }
  #co2Note:hover { color: var(--ink); }
  /* Aufklapp-Zeile des Fußblocks — nur auf schmalen Viewports sichtbar (siehe Mobil-Query unten).
     Auf dem Desktop hat der Fußblock Platz für alle Zeilen, dort gibt es nichts zu falten. Die
     Klasse .srcCollapsed steht schon im Markup; sie greift ausschließlich innerhalb der Query. */
  #srcToggle { display: none; }
  /* event / El-Niño callouts: screen-space margin column (uniform size, chronological) + SVG leader lines */
  #annot { position: fixed; inset: 0; pointer-events: none; }
  #annot svg { position: absolute; inset: 0; }
  .callout { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 14px; font-weight: 600;
    color: var(--ink); background: rgba(12,11,9,.84); border: 1px solid rgba(216,162,74,.55);
    border-radius: 999px; padding: 5px 12px; will-change: transform; }
  .callout.nino { border-color: rgba(79,195,214,.55); }

  /* ---------- wide widths: turn the info overlay from a narrow chute into a designed panel ----------
     Below 900px the card keeps its single-column min(560px,100%) form (phones + narrow tablets read the
     chain top-to-bottom). From 900px up there is room for the two-part layout: a centered reading lane
     for the numbered chain (capped at a comfortable measure, NOT stretched to the card width — long lines
     hurt reading), and a full-width 2×2 grid of deep-dive tiles beneath it. Content is unchanged; only the
     shape widens. This is the fix for the ~3.8× scroll the narrow card forced. */
  @media (min-width: 900px) {
    .info-card { width: min(980px, 100%); }
    .info-lane { max-width: 680px; margin: 0 auto; }
    /* Multicol, NOT grid: the CO₂ tile is ~3× taller than its neighbours, and a row-aligned grid would
       leave a tall void under whichever short tile shares its row. Multicol packs tiles down each column
       independently — a short tile is immediately followed by the next, no row gaps. Reading order stays
       source order (fill col 1 top-to-bottom, then col 2). Ragged column bottoms are fine; internal voids
       are what we are removing. break-inside:avoid keeps each tile whole. */
    .info-tiles { display: block; columns: 2; column-gap: 26px; margin-top: 20px;
      padding-top: 18px; border-top: 1px solid rgba(232,228,221,.1); }
    /* each deep-dive block reads as its own tile so the grid looks intentional, not like wrapped text */
    .info-tiles .info-sec { break-inside: avoid; margin-bottom: 16px; border: 1px solid rgba(232,228,221,.09);
      border-radius: 12px; padding: 14px 17px 15px; background: rgba(255,255,255,.02); }
    .info-tiles .info-sec h3 { margin-top: 4px; }
  }

  /* ---------- medium widths: keep the centered title clear of the left control panel ----------
     On large screens the full-width centered title sits well above/around the panel. Around ~1280px
     the panel (left edge column, up to x≈436) and the long German title collide. Constrain the title
     box to the region right of the panel so their bounding boxes stay disjoint; nudge the size down a
     touch. Above 1500px nothing changes. Mobile (≤640px) keeps its own rule below. */
  @media (min-width: 641px) and (max-width: 1500px) {
    #title { left: 456px; right: 16px; font-size: 23px; }
  }

  /* ---------- mobile / small touch screens ---------- */
  @media (max-width: 640px) {
    /* ---------- reserved bottom band + side gutters for the 3D scene ----------
       The scene used to render across the whole viewport. On a ~412 px phone that put the year axis
       (screen-left) and the CO2 strip (screen-right) half outside the frame — only label fragments
       were visible — and it let the source block sit as opaque text straight over the spiral.

       Two separate causes, two separate fixes:
       1. The canvas gets side gutters and a reserved band at the bottom (below), and the renderer is
          resized onto that box (resize() reads canvas.clientWidth/Height). Nothing is CSS-scaled.
       2. Gutters alone would NOT uncrop the axes: the perspective FOV is VERTICAL, so a narrower box
          shows LESS to the sides, not more. The camera therefore dollies back on narrow aspects —
          see frameScale() in JS. The two belong together; changing one without the other regresses.

       Band arithmetic (all four numbers below are load-bearing, keep them in sync):
         play bar   bottom 12 + (44 scrub + 2*8 padding + 2 border = 62)      -> top edge at  74 px
         source row bottom 82 + (15.5 line + 2*5 padding ~= 26)               -> top edge at 108 px
         + 4 px breathing room                                               -> band = 112 px
       Scene box is therefore (viewport height − 112 px) tall; positive down to any realistic
       portrait height. See the note on the #c rule for why that height is spelled as a percentage
       of the containing block rather than as dvh. */
    :root { --scene-band: 112px; --scene-gutter: 26px; }
    /* Both boxes get the SAME insets — the callout projection assumes #annot is congruent with #c.
       They do NOT get the same sizing technique, because they are not the same kind of box:

       #annot is a <div>. For a non-replaced absolutely/fixed positioned box, `width:auto` with two
       non-auto insets is solved FROM the insets (CSS 2.1 §10.3.7 / §10.6.4) — it spans between them,
       which is exactly what we want. Nothing further to state.

       #c is a <canvas> — a REPLACED element, and §10.3.8 / §10.6.5 apply instead: with `width`/
       `height` at `auto` the used values come from the INTRINSIC size (i.e. from the canvas's width/
       height ATTRIBUTES), and the then over-constrained `right`/`bottom` are simply dropped. The box
       would sit at left/top in whatever size the attributes happen to have — and since resize() reads
       canvas.clientWidth and renderer.setSize() writes those very attributes multiplied by the pixel
       ratio, every resize would multiply the box by that ratio (300x150 default -> 600x300 after
       setPixelRatio(2) -> 1200x600 after the first resize() -> ...). On a phone that pushed the scene
       centre far outside the viewport: background only. So the canvas states its size EXPLICITLY;
       `left`/`top` from the shorthand still place it, and the ignored `right`/`bottom` are already
       accounted for inside the calc. No wrapper element, because the box would need the identical
       numbers one level up while adding a node to the stacking order that #annot, the pointer
       handling and renderer.domElement all currently sit next to.

       Percentages, deliberately NOT dvh: they resolve against the same initial containing block that
       the insets on #annot resolve against, so the two boxes stay congruent to the pixel. */
    #c, #annot { inset: 0 var(--scene-gutter) var(--scene-band); }
    #c { width: calc(100% - var(--scene-gutter) * 2); height: calc(100% - var(--scene-band)); }
    /* compact heading so the long German title can't stack into 3 lines over the readout */
    #title { top: 12px; font-size: 17px; line-height: 1.15; letter-spacing: 0; padding: 0 14px; }
    /* live value: smaller, nudged clear of a (max 2-line) title */
    #readout { top: 56px; font-size: 12.5px; line-height: 1.3; padding: 0 14px; }
    /* footer block: sits in the reserved band, directly above the play bar (top edge 74 px) */
    #footer { left: 14px; bottom: 82px; max-width: calc(100vw - 28px); gap: 5px; }
    #caption, #videoLink, #legalLinks { font-size: 11.5px; }
    /* ---------- collapsible source block ----------
       Collapsed is the default on narrow screens, but it is deliberately never EMPTY: the one line
       that stays shows the provenance itself (NASA GISTEMP v4 · Basis 1951-1980, from DS.source, so
       it is bilingual by construction) plus a chevron. Tapping it reveals the CO2 seam note, the
       record line, the retrieval date and the wordmark — over an opaque panel, so the expanded state
       does not repeat the collision it was built to remove. The long-form explanations stay in the
       ⓘ overlay; this block does not duplicate them. */
    #footer.srcCollapsed #co2Note,
    #footer.srcCollapsed #parisNote,
    #footer.srcCollapsed #record,
    #footer.srcCollapsed #caption,
    #footer.srcCollapsed #videoLink,
    #footer.srcCollapsed #legalLinks,
    #footer.srcCollapsed #brandmark { display: none; }
    #footer:not(.srcCollapsed) { background: rgba(9,8,6,.93); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 9px 11px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      text-shadow: none; box-shadow: 0 10px 34px rgba(0,0,0,.45); }
    /* exactly ONE line, always — the reserved band is measured against that, so the text is clipped
       with an ellipsis rather than allowed to wrap and push the band arithmetic out of true */
    #srcToggle { display: flex; align-items: center; gap: 7px; pointer-events: auto; max-width: 100%;
      background: transparent; border: none; border-radius: 0; padding: 4px 0 0; margin: 0;
      font-size: 11.5px; line-height: 1.35; color: var(--ink-muted); text-align: left;
      white-space: nowrap; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
    #srcToggleTxt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    /* collapsed it is the only thing between the graphic and the eye — give it its own backdrop */
    #footer.srcCollapsed #srcToggle { background: rgba(9,8,6,.72); border-radius: 8px; padding: 5px 9px; }
    #srcToggle .src-chev { display: inline-block; flex: 0 0 auto; color: var(--copper); transition: transform .18s ease; }
    #footer:not(.srcCollapsed) #srcToggle .src-chev { transform: rotate(180deg); }
    /* controls: compact, height-capped, scrollable — they start collapsed via JS on small screens */
    #panel { left: 10px; top: 10px; min-width: 0; max-width: calc(100vw - 20px);
      max-height: calc(100dvh - 20px); overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 13px; gap: 8px; }
    #panel .row, #panel .grid2, #panel .cylGrid { gap: 5px; }
    /* die .cylGrid-Regel schlaegt per Spezifitaet die generische Mobil-Buttonhoehe — hier nachziehen.
       8px statt 4px horizontal: sechs Spalten bleiben damit unter der Panelbreite und die Tap-Flaeche
       kommt auf ~44px in beide Richtungen. */
    #panel .cylGrid button { padding: 12px 8px; }
    /* collapsed = a drawer handle centred on the left edge, clear of the title/readout at the top */
    #panelOpen { top: 50%; transform: translateY(-50%); width: 40px; height: 48px; }
    /* comfortable tap targets: raise the button height toward ≥40px. Only vertical padding grows —
       horizontal stays at 11px, damit die zwei Rasterspalten auch bei 375px nebeneinander passen. */
    button { padding: 12px 11px; }
    /* play bar: always visible — it's the primary control, so don't auto-hide it on touch — but flat.
       One row, 62 px tall in total: 40 px play button, scrub, year. The explicit padding:0 on #play
       matters: without it the generic mobile button padding above fights the fixed 40x40 box. */
    #bottom { bottom: 12px; width: calc(100vw - 20px); gap: 10px; padding: 8px 10px; }
    #bottom.barHidden { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    #play { width: 40px; height: 40px; font-size: 15px; padding: 0; }
    #tlabel { min-width: 46px; font-size: 12px; }
    /* scrub: 44 px tap target, unchanged 6 px track. The box grows through PADDING, not through the
       track, and content-box makes that independent of any engine's height arithmetic: the content
       box stays exactly 6 px (as on desktop) and the border box — which is what gets hit-tested —
       becomes 6 + 2*19 = 44. accent-color keeps painting the gold fill and handle, which
       -webkit-appearance:none would have switched off. Gecko draws its track at the element height
       rather than inside the content box, so there it is pinned explicitly. */
    #scrub { box-sizing: content-box; height: 6px; padding: 19px 0; }
    #scrub::-moz-range-track { height: 6px; border-radius: 3px; }
    #scrub::-moz-range-progress { height: 6px; border-radius: 3px; }
    /* the desktop mouse hint is wrong on touch and overlaps the controls — hide it */
    .hint { display: none; }
    .callout { font-size: 12px; padding: 4px 9px; }
    /* brand wordmark: bottom line of the footer block (position inherited from the base rule) */
    #brandmark { font-size: 9px; letter-spacing: 1.2px; }
  }

  <div id="footer" class="srcCollapsed">

      { h:"2 · Warum zwei Vergleichszeiträume?",
        body:"Die Wissenschaft nimmt <b>1951–1980</b>, weil dieser Zeitraum weltweit dicht und verlässlich gemessen ist — ein stabiler Nullpunkt für die Datenreihe. Klimapolitik (das Pariser Abkommen) misst gegen <b>„vorindustriell“ (1850–1900)</b>, weil das Ziel lautet: die menschengemachte Erwärmung <em>seit Beginn der Industrialisierung</em> begrenzen. Andere Frage, anderer Nullpunkt." },
      { h:"3 · Der Versatz: +0,19 °C.",
        body:"Schon 1951–1980 war die Welt rund <b>0,19 °C wärmer</b> als 1850–1900 (NASA-GISS-Wert laut GISTEMP-FAQ, Stand Jan 2025). Umrechnen heißt: diese 0,19 °C draufzählen. Deshalb liegen die <b>Paris-Linien weiter innen</b> als unsere gleichnamigen Ringe:<ul><li>Unser <b>+1,5-°C-Ring</b> ≈ <b>+1,7 °C vorindustriell</b> — schon <em>jenseits</em> des Paris-Ziels.</li><li>Das echte <b>Paris-1,5-°C-Limit</b> sitzt auf unserer Skala bei <b>+1,31 °C</b>, das <b>2-°C-Limit</b> bei <b>+1,81 °C</b>. Genau das zeichnet der Schalter „Paris-Ringe“.</li></ul><br><br><span class=\"sub\">Wie belastbar die 0,19 °C sind.</span> Die Umrechnung ist gröber, als zwei Nachkommastellen vermuten lassen:<ul><li><b>Ein Wert für alle zwölf Monate.</b> Der echte Versatz hat einen Jahresgang: aus Berkeley-Earth-Rohdaten gerechnet läuft er zwischen rund <b>+0,22 °C (Juli)</b> und <b>+0,36 °C (November)</b> — eine Spanne von 0,14 °C, also so groß wie die Korrektur selbst. Für Jahres- und Mehrjahresmittel ist ein fester Wert unproblematisch, für einen einzelnen Monat ist er eine Näherung. Copernicus sagt es ausdrücklich: Für Zwölfmonatsmittel reicht ein solcher Versatz, kürzere Zeiträume brauchen Zusatzannahmen.</li><li><b>Der Versatz hängt am Datensatz.</b> Berkeley Earth nutzt denselben Basiszeitraum 1951–1980 und kommt auf <b>+0,31 °C</b>; die WMO beziffert die Unsicherheit des Versatzes mit 0,12 °C. Mit +0,19 °C liegt diese Umrechnung am unteren Rand: Für 2011–2020 ergibt sie 1,02 °C vorindustriell, während der IPCC AR6 die Erwärmung dieses Jahrzehnts mit <b>1,09 °C</b> bewertet.</li><li><b>Die Ringe sind eine Referenzlinie, kein Urteil.</b> Sie zeigen, wo die Paris-Schwellen auf dieser Achse liegen — nicht, dass sie erreicht sind. Der IPCC bemisst das Überschreiten am <b>20-Jahres-Mittel</b> (AR6 SPM, Fußnote 26; B.1.4 hält fest, dass ein einzelnes Jahr über 1,5 °C das Niveau noch nicht bedeutet — allein die interne Variabilität bewegt ein Einzeljahr um ±0,25 °C). Vorindustriell gerechnet liegt das Mittel der Jahre 2006–2025 bei rund 1,04 °C.</li></ul>" },

      { h:"5 · Die Form betont warme Jahre — bewusst, aber gut zu wissen.",

      { h:"6 · Die Rekorde 2023/24 sind nicht nur der Trend.",
        body:"Die spektakulären Ausschläge 2023 und 2024 fielen in eine starke <b>El-Niño-Phase</b> — ein natürliches Muster, das kurzzeitig zusätzliche Wärme aus dem Pazifik in die globale Temperatur schiebt. Der langfristige Anstieg darunter ist die menschengemachte Erwärmung, aber einen einzelnen Rekordmonat sollte man nicht als neuen Dauerzustand lesen. Der Schalter <b>„Super El Niño“</b> markiert die stärksten El-Niño-Phasen (ONI-Spitze ≥ 2,0 — die seltenste Kategorie), damit sich beides auseinanderhalten lässt." },
      { h:"CO₂: zwei Quellen, eine Kurve",
        body:"Die violette Kurve rechts zeigt die CO₂-Konzentration der Atmosphäre — die Ursache, während die Spirale die Wirkung zeigt.<br><br><span class=\"sub\">Zwei Reihen, eine sichtbare Naht.</span> Sie stammt aus <b>zwei</b> Messreihen. Ab März 1958 sind es Monatswerte vom Mauna Loa (NOAA GML), davor der Law-Dome-Spline aus antarktischen Eiskernen. Die Naht ist sichtbar gemacht: <b>gestrichelt</b> vor 1958, <b>durchgezogen</b> danach.<br><br><span class=\"sub\">Warum der gestrichelte Teil glatt ist.</span> Der Eiskern liefert <em>Jahres</em>werte. Für die Darstellung werden sie auf das Monatsraster interpoliert — der gestrichelte Teil ist also berechnet, nicht monatlich gemessen. Aus demselben Grund fehlt dort der Jahresgang: Die Luft schließt sich über rund ein Jahrzehnt in der Firnschicht ein, das glättet die jahreszeitliche Schwankung weg. Ab 1958 wäre er messbar — das Atmen der Nordhalbkugel-Vegetation, rund 6 ppm im Jahresrhythmus. Gezeichnet ist er trotzdem nicht: Auf einem Streifen von 200 ppm Breite wären 6 ppm keine zwei Pixel, das sähe nach einer unsauber gezogenen Linie aus statt nach einem Signal. Die Kurve zeigt deshalb durchgehend den saisonbereinigten Trend.<br><br><span class=\"sub\">Warum umgeschaltet und nicht gemischt wird.</span> Die beiden Reihen messen verschiedene Orte. An der Naht selbst springt die Kurve nicht — dort liegen die Werte 0,57 ppm auseinander, unsichtbar auf einem Streifen von 140 ppm. Über die folgenden Jahrzehnte laufen sie aber systematisch auseinander: Mauna Loa liegt auf 19° Nord, die antarktischen Messstellen tief im Süden, und weil fast alle Emissionen auf der Nordhalbkugel entstehen, liest der Norden höher — 1960 rund 1,4 ppm, 1990 rund 3,4 ppm. Der Abstand wächst mit den Emissionen. Man sieht dieser Zahl also an, wo verbrannt wird." },

      { h:"Perspektive: warum die Kurve je nach Blickwinkel anders steil wirkt",
        body:"Die CO₂-Kurve steht im dreidimensionalen Raum, also wirkt sie je nach Blickwinkel unterschiedlich steil. In der Standardansicht — die Kamera liegt über dem Trichter — ist die ppm-Spanne oben rund <b>25 % breiter</b> als unten. Der jüngste Anstieg bekommt dadurch etwas mehr Weg, als ihm zusteht.<br><br>Das ist keine Eigenschaft der Daten, sondern des Blickwinkels. Auf Augenhöhe mit der Mitte des Streifens verschwindet der Effekt vollständig — dafür gibt es den Schalter <em>Seitenansicht</em>. Von unten betrachtet kehrt er sich sogar um und <em>untertreibt</em> den Anstieg.<br><br>Die senkrechten Rasterlinien verzerren exakt mit der Kurve. Deshalb stimmt jeder abgelesene Wert in jeder Höhe: Wo die Kurve die 400er-Linie schneidet, sind es 400 ppm, egal wie die Kamera steht. Verzerrt ist der Eindruck der Steigung — nicht die Zahl." },

  en: {

    sections: [
      { h:"1 · Every number is an anomaly, not a thermometer reading.",
        body:"The spiral doesn’t show <em>the</em> temperature — it shows how far a month sits from the average of a fixed reference period. For the NASA data (GISTEMP) that period is <b>1951–1980</b>. So “+1 °C” means: 1 °C warmer than the average of those three decades." },
      { h:"2 · Why two reference periods?",
        body:"Science uses <b>1951–1980</b> because it is densely and reliably measured worldwide — a stable zero point for the record. Climate policy (the Paris Agreement) measures against <b>“pre-industrial” (1850–1900)</b>, because the goal is to limit human-made warming <em>since the start of industrialisation</em>. Different question, different zero point." },
      { h:"3 · The offset: +0.19 °C.",
        body:"Even in 1951–1980 the world was already about <b>0.19 °C warmer</b> than in 1850–1900 (NASA GISS figure per the GISTEMP FAQ, as of Jan 2025). Converting means adding those 0.19 °C. That’s why the <b>Paris lines sit further in</b> than our identically named rings:<ul><li>Our <b>+1.5 °C ring</b> ≈ <b>+1.7 °C above pre-industrial</b> — already <em>beyond</em> the Paris target.</li><li>The actual <b>Paris 1.5 °C limit</b> lands at <b>+1.31 °C</b> on our scale, the <b>2 °C limit</b> at <b>+1.81 °C</b>. That’s exactly what the “Paris rings” switch draws.</li></ul><br><br><span class=\"sub\">How solid those 0.19 °C are.</span> The conversion is coarser than two decimal places suggest:<ul><li><b>One value for all twelve months.</b> The real offset has a seasonal cycle: computed from Berkeley Earth raw data it runs between roughly <b>+0.22 °C (July)</b> and <b>+0.36 °C (November)</b> — a spread of 0.14 °C, as large as the correction itself. For annual and multi-year means a fixed value is harmless; for a single month it is an approximation. Copernicus says so explicitly: a scalar offset is adequate for twelve-month means, shorter periods need additional assumptions.</li><li><b>The offset depends on the dataset.</b> Berkeley Earth uses the same 1951–1980 baseline and arrives at <b>+0.31 °C</b>; the WMO puts the uncertainty of the offset at 0.12 °C. At +0.19 °C this conversion sits at the low end: for 2011–2020 it gives 1.02 °C above pre-industrial, where IPCC AR6 assesses that decade’s warming at <b>1.09 °C</b>.</li><li><b>The rings are a reference line, not a verdict.</b> They show where the Paris thresholds fall on this axis — not that they have been reached. The IPCC judges exceedance on a <b>20-year mean</b> (AR6 SPM footnote 26; B.1.4 states that a single year above 1.5 °C does not mean the level is reached — internal variability alone moves an individual year by ±0.25 °C). Converted to the pre-industrial baseline, the mean of 2006–2025 sits at about 1.04 °C.</li></ul>" },
      { h:"4 · Keeping it honest: a record month ≠ target breached.",
        body:"The Paris 1.5 °C target refers to the <b>long-term average</b> (~20 years), not single months. Record months like September 2023 already passed 1.5 °C above pre-industrial — but the 20-year mean of this series (2006–2025) sits at only about <b>1.04 °C</b> above pre-industrial. So “the target is breached” would be premature. Higher figures quoted for “current warming” measure shorter, more recent windows: the last five years of this series average around 1.27 °C. Entire 12-month periods have already exceeded 1.5 °C since 2024 (Copernicus/ERA5) — but Paris is judged on the long-term mean, not single years." },
      { h:"5 · The shape emphasises warm years — by design, but worth knowing.",
        body:"A month’s radius is its anomaly <em>plus</em> a fixed distance from the centre. Cold values sit tight in the middle, warm ones far out — and out there each loop is longer, because circumference grows with radius. So warm years get more line and more “ink” than equally sized swings downward. The 3D funnel adds to it: the late, wide loops look bigger than the early ones in the narrow neck. This is <b>not a numerical trick</b> — it’s the same visualisation Ed Hawkins and NASA use — but it’s worth knowing. To compare magnitudes soberly: <b>“Top-down”</b> flattens the funnel, the <b>“Height”</b> slider sets how much it exaggerates, and every scale ring carries its real °C value. The number is what counts, not the area." },
      { h:"6 · The 2023/24 records aren’t trend alone.",
        body:"The dramatic spikes of 2023 and 2024 fell in a strong <b>El Niño phase</b> — a natural pattern that briefly pushes extra heat from the Pacific into the global temperature. The long-term rise underneath is human-made warming, but a single record month shouldn’t be read as the new normal. The <b>“Super El Niño”</b> toggle marks the strongest El Niño phases (peak ONI ≥ 2.0 — the rarest category) so the two can be told apart." },
      { h:"CO₂: two sources, one curve",
        body:"The violet curve on the right shows atmospheric CO₂ — the cause, where the spiral shows the effect.<br><br><span class=\"sub\">Two records, one visible seam.</span> It comes from <b>two</b> records. From March 1958 onwards these are monthly readings from Mauna Loa (NOAA GML); before that, the Law Dome spline from Antarctic ice cores. The seam is shown rather than hidden: <b>dashed</b> before 1958, <b>solid</b> after.<br><br><span class=\"sub\">Why the dashed part is smooth.</span> The ice core gives <em>annual</em> values. For this display they are interpolated onto the monthly grid — so the dashed part is computed, not measured monthly. For the same reason it carries no seasonal cycle: air takes about a decade to become trapped in the firn layer, which smooths the yearly swing away. From 1958 onwards it would be measurable — Northern Hemisphere vegetation breathing, about 6 ppm a year. It is still not drawn: on a strip spanning 200 ppm, 6 ppm is under two pixels, which would read as a carelessly drawn line rather than a signal. So the curve shows the deseasonalised trend throughout.<br><br><span class=\"sub\">Why switch rather than blend.</span> The two records measure different places. At the seam itself the curve does not jump — the two values sit 0.57 ppm apart, invisible on a strip spanning 140 ppm. Over the following decades they diverge systematically: Mauna Loa sits at 19° North, the Antarctic stations far to the south, and because almost all emissions occur in the Northern Hemisphere the north reads higher — about 1.4 ppm in 1960, about 3.4 ppm by 1990. The gap grows with emissions. That number tells you where the burning happens." },
      { h:"What this graphic does not claim",
        body:"Two curves rising together are a <b>correlation</b> — not a proof. That CO₂ drives the warming is known from radiative physics: from laboratory measurements of its absorption bands, from satellite measurements of outgoing longwave radiation, from comparing models with and without greenhouse gases. This display puts two measured records side by side. It does not derive one from the other, and it cannot." },
      { h:"Perspective: why the curve looks steeper from some angles",
        body:"The CO₂ curve sits in three-dimensional space, so it looks steeper or shallower depending on the viewing angle. In the default view — camera above the funnel — the ppm span at the top is about <b>25 % wider</b> than at the bottom. That gives the most recent rise a little more travel than it has earned.<br><br>This is a property of the angle, not of the data. Level with the middle of the strip the effect vanishes entirely — that is what the <em>Side view</em> button is for. Seen from below it even reverses, and <em>understates</em> the rise.<br><br>The vertical grid lines are distorted in exactly the same way as the curve. That is why any value you read off is correct at any height: where the curve crosses the 400 line it is 400 ppm, no matter where the camera is. What is distorted is the impression of steepness — not the number." },
      { h:"Who built this",
        body:"This is not original research, and the author is not a climate scientist. The spiral visualises published records from named institutions: the temperatures from <b>NASA GISTEMP v4</b>, the CO₂ from the <b>Law Dome ice core</b> and the <b>NOAA Global Monitoring Laboratory</b> (Mauna Loa). The values are used unchanged; the processing is documented.<br><br>What the visualisation does well and where it is weak is stated openly in this overlay — the sections on the geometry and on the baseline name the known distortions. If you find an error: corrections are welcome, <b>contact@aeternalabs.io</b>.<br><br>The same spiral is available as a finished video in four versions (square and portrait, German and English, with and without Paris rings) — to watch and to download in 4K under \"Watch the spiral as video\"." },
    ],
    co2Note: "CO₂: ice core to 1958 (dashed), Mauna Loa after —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "Sources: NASA GISTEMP v4 · GISS baseline offset · IPCC AR6 · Visualisation after Ed Hawkins / NASA SVS · CO₂: NOAA GML Mauna Loa; Law Dome (Etheridge et al., MacFarling Meure et al.) via NOAA NCEI Paleo",
  },
  fr: {
    title: "Période de référence, objectifs de l’Accord de Paris et lecture de la représentation",
    subtitle: "Ce que signifient les valeurs en °C — et ce que met en avant la représentation",
    close: "Fermer",
    note: 'L’Accord de Paris se mesure par rapport à 1850–1900 (+0,19 °C) · qu’est-ce que cela signifie ?&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · Chaque chiffre est une anomalie, pas une température affichée.",
        body:"La spirale ne montre pas <em>la</em> température, mais l’anomalie d’un mois par rapport à la moyenne d’une période de référence fixe. Pour les données de la NASA (GISTEMP), cette période est <b>1951–1980</b>. « +1 °C » signifie donc : 1 °C de plus que la moyenne de ces trois décennies." },
      { h:"2 · Pourquoi deux périodes de référence ?",
        body:"La science retient <b>1951–1980</b>, une période mesurée de façon dense et fiable dans le monde entier — un point zéro stable pour la série de données. La politique climatique (l’Accord de Paris) se mesure par rapport au <b>« préindustriel » (1850–1900)</b>, car l’objectif est de limiter le réchauffement d’origine humaine <em>depuis le début de l’industrialisation</em>. Question différente, point zéro différent." },
      { h:"3 · Le décalage : +0,19 °C.",
        body:"Dès 1951–1980, le monde était déjà environ <b>0,19 °C plus chaud</b> qu’en 1850–1900 (valeur NASA GISS selon la FAQ GISTEMP, état janvier 2025). Convertir revient à ajouter ces 0,19 °C. C’est pourquoi les <b>lignes de l’Accord de Paris se situent plus à l’intérieur</b> que nos anneaux de même nom :<ul><li>Notre <b>anneau +1,5 °C</b> ≈ <b>+1,7 °C au-dessus du niveau préindustriel</b> — déjà <em>au-delà</em> de l’objectif de l’Accord de Paris.</li><li>La véritable <b>limite de l’Accord de Paris à 1,5 °C</b> se situe à <b>+1,31 °C</b> sur notre échelle, la <b>limite à 2 °C</b> à <b>+1,81 °C</b>. C’est exactement ce que trace le bouton « Anneaux de l’Accord de Paris ».</li></ul><br><br><span class=\"sub\">La solidité de ces 0,19 °C.</span> La conversion est plus grossière que deux décimales ne le laissent penser :<ul><li><b>Une seule valeur pour les douze mois.</b> Le décalage réel a un cycle saisonnier : calculé à partir des données brutes de Berkeley Earth, il varie entre environ <b>+0,22 °C (juillet)</b> et <b>+0,36 °C (novembre)</b> — un écart de 0,14 °C, aussi grand que la correction elle-même. Pour des moyennes annuelles ou pluriannuelles, une valeur fixe ne pose pas de problème ; pour un mois isolé, c’est une approximation. Copernicus le dit explicitement : un décalage unique convient aux moyennes sur douze mois, les périodes plus courtes demandent des hypothèses supplémentaires.</li><li><b>Le décalage dépend du jeu de données.</b> Berkeley Earth utilise la même période de référence 1951–1980 et obtient <b>+0,31 °C</b> ; l’OMM chiffre l’incertitude du décalage à 0,12 °C. Avec +0,19 °C, cette conversion se situe dans le bas de la fourchette : pour 2011–2020, elle donne 1,02 °C au-dessus du niveau préindustriel, alors que l’IPCC AR6 évalue le réchauffement de cette décennie à <b>1,09 °C</b>.</li><li><b>Les anneaux sont une ligne de référence, pas un verdict.</b> Ils montrent où se situent les seuils de Paris sur cet axe — pas qu’ils sont atteints. L’IPCC évalue le dépassement sur une <b>moyenne de 20 ans</b> (AR6 SPM, note 26 ; le paragraphe B.1.4 précise qu’une seule année au-dessus de 1,5 °C ne signifie pas que ce niveau est atteint — la seule variabilité interne fait varier une année isolée de ±0,25 °C). Convertie sur la base préindustrielle, la moyenne des années 2006–2025 se situe à environ 1,04 °C.</li></ul>" },
      { h:"4 · Rester honnête : un mois record ≠ objectif dépassé.",
        body:"L’objectif de l’Accord de Paris à 1,5 °C désigne la <b>moyenne de long terme</b> (~20 ans), pas des mois isolés. Des mois record comme septembre 2023 ont déjà dépassé 1,5 °C au-dessus du niveau préindustriel — mais la moyenne sur 20 ans de cette série (2006–2025) n’est encore qu’à environ <b>1,04 °C</b> au-dessus du niveau préindustriel. Dire que « l’objectif est dépassé » serait donc prématuré. Les chiffres plus élevés cités pour « le réchauffement actuel » mesurent des fenêtres plus courtes et plus récentes : les cinq dernières années de cette série affichent une moyenne d’environ 1,27 °C. Des périodes entières de 12 mois ont déjà dépassé 1,5 °C depuis 2024 (Copernicus/ERA5) — mais l’Accord de Paris se juge sur la moyenne de long terme, pas sur des années isolées." },
      { h:"5 · La forme met en valeur les années chaudes — volontairement, mais bon à savoir.",
        body:"Le rayon d’un mois est son anomalie <em>plus</em> une distance fixe au centre. Les valeurs froides restent serrées au centre, les chaudes s’étalent loin vers l’extérieur — et là-bas, chaque boucle est plus longue, car la circonférence croît avec le rayon. Les années chaudes reçoivent ainsi plus de trait et plus « d’encre » que des écarts vers le bas de même ampleur. L’entonnoir en 3D accentue l’effet : les boucles tardives et larges paraissent plus grandes que les premières, resserrées dans le col étroit. Ce <b>n’est pas un artifice numérique</b> — c’est la même visualisation qu’utilisent Ed Hawkins et la NASA — mais c’est bon à savoir. Pour comparer les grandeurs sobrement : <b>« Vue de dessus »</b> aplatit l’entonnoir, le curseur <b>« Hauteur »</b> règle l’intensité de l’exagération, et chaque anneau de graduation porte sa vraie valeur en °C. Ce qui compte, c’est le chiffre, pas la surface." },
      { h:"6 · Les records de 2023/24 ne sont pas que la tendance.",
        body:"Les pics spectaculaires de 2023 et 2024 sont survenus pendant une forte <b>phase El Niño</b> — un phénomène naturel qui pousse brièvement une chaleur supplémentaire du Pacifique vers la température globale. La hausse de fond en dessous est le réchauffement d’origine humaine, mais un seul mois record ne doit pas être lu comme le nouveau normal. Le bouton <b>« Super El Niño »</b> signale les phases El Niño les plus fortes (pic ONI ≥ 2,0 — la catégorie la plus rare) pour permettre de distinguer les deux." },
      { h:"CO₂ : deux sources, une courbe",
        body:"La courbe violette à droite montre le CO₂ atmosphérique — la cause, là où la spirale montre l’effet.<br><br><span class=\"sub\">Deux séries, une jointure visible.</span> Elle provient de <b>deux</b> séries de mesures. À partir de mars 1958, ce sont des relevés mensuels de Mauna Loa (NOAA GML) ; avant cela, la courbe lissée de Law Dome issue de carottes de glace antarctiques. La jointure est montrée plutôt que masquée : <b>en pointillés</b> avant 1958, <b>en trait plein</b> après.<br><br><span class=\"sub\">Pourquoi la partie en pointillés est lisse.</span> La carotte de glace fournit des valeurs <em>annuelles</em>. Pour cet affichage, elles sont interpolées sur la grille mensuelle — la partie en pointillés est donc calculée, pas mesurée mois par mois. Pour la même raison, elle ne présente pas de cycle saisonnier : l’air met environ une décennie à être piégé dans la couche de névé, ce qui lisse la variation annuelle. À partir de 1958, ce cycle serait mesurable — la respiration de la végétation de l’hémisphère Nord, environ 6 ppm par an. Il n’est pourtant pas tracé : sur une bande large de 200 ppm, 6 ppm représentent moins de deux pixels, ce qui ressemblerait à un trait mal tracé plutôt qu’à un signal. La courbe montre donc partout la tendance désaisonnalisée.<br><br><span class=\"sub\">Pourquoi basculer plutôt que fondre les deux séries.</span> Les deux séries mesurent des lieux différents. À la jointure elle-même, la courbe ne fait pas de saut : les deux valeurs sont écartées de 0,57 ppm, invisible sur une bande large de 140 ppm. Au fil des décennies suivantes, elles divergent systématiquement : Mauna Loa se trouve à 19° Nord, les stations antarctiques loin au sud, et comme la quasi-totalité des émissions se produit dans l’hémisphère Nord, le nord affiche des valeurs plus élevées — environ 1,4 ppm en 1960, environ 3,4 ppm en 1990. L’écart grandit avec les émissions. Ce chiffre indique donc où se produit la combustion." },
      { h:"Ce que ce graphique n’affirme pas",
        body:"Deux courbes qui montent ensemble, c’est une <b>corrélation</b> — pas une preuve. Que le CO₂ entraîne le réchauffement, on le sait par la physique du rayonnement : par les mesures en laboratoire de ses bandes d’absorption, par les mesures satellitaires du rayonnement infrarouge sortant, par la comparaison de modèles avec et sans gaz à effet de serre. Cette représentation met côte à côte deux séries mesurées. Elle ne déduit pas l’une de l’autre, et ne le peut pas." },
      { h:"Perspective : pourquoi la courbe paraît plus ou moins raide selon l’angle",
        body:"La courbe de CO₂ se situe dans un espace tridimensionnel, elle paraît donc plus ou moins raide selon l’angle de vue. Dans la vue par défaut — caméra au-dessus de l’entonnoir — l’étendue en ppm est, en haut, environ <b>25 % plus large</b> qu’en bas. La hausse la plus récente y gagne ainsi un peu plus d’amplitude qu’elle n’en mérite.<br><br>C’est une propriété de l’angle, pas des données. Au niveau du milieu de la bande, l’effet disparaît entièrement — c’est à cela que sert le bouton <em>Vue latérale</em>. Vu d’en dessous, il s’inverse même et <em>sous-estime</em> la hausse.<br><br>Les lignes de grille verticales se déforment exactement de la même façon que la courbe. C’est pourquoi toute valeur lue reste correcte à n’importe quelle hauteur : là où la courbe croise la ligne des 400, c’est 400 ppm, quelle que soit la position de la caméra. Ce qui est déformé, c’est l’impression de pente — pas le chiffre." },
      { h:"Qui a construit ceci",
        body:"Ceci n’est pas une recherche originale, et l’auteur n’est pas climatologue. La spirale visualise des séries de données publiées par des institutions nommées : les températures de <b>NASA GISTEMP v4</b>, le CO₂ de la <b>carotte de glace de Law Dome</b> et du <b>NOAA Global Monitoring Laboratory</b> (Mauna Loa). Les valeurs sont reprises sans modification ; le traitement est documenté.<br><br>Ce que la visualisation réussit et où elle est faible est indiqué ouvertement dans cette fenêtre — les sections sur la géométrie et sur la période de référence nomment les distorsions connues. Si vous trouvez une erreur : les corrections sont bienvenues, <b>contact@aeternalabs.io</b>.<br><br>La même spirale existe en vidéo finalisée en quatre versions (carrée et portrait, allemand et anglais, avec et sans anneaux de l’Accord de Paris) — à regarder et à télécharger en 4K sous « Voir la spirale en vidéo »." },
    ],
    co2Note: "CO₂ : carotte de glace jusqu’en 1958 (pointillés), Mauna Loa ensuite —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "Sources : NASA GISTEMP v4 · décalage de référence GISS · IPCC AR6 · représentation d’après Ed Hawkins / NASA SVS · CO₂ : NOAA GML Mauna Loa ; Law Dome (Etheridge et al., MacFarling Meure et al.) via NOAA NCEI Paleo",
  },
  es: {
    title: "Periodo de referencia, objetivos de París y cómo leer la representación",
    subtitle: "Qué significan los valores en °C — y qué resalta la representación",
    close: "Cerrar",
    note: 'París se mide respecto a 1850–1900 (+0,19 °C) · ¿qué significa eso?&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · Cada cifra es una anomalía, no una lectura de termómetro.",
        body:"La espiral no muestra <em>la</em> temperatura, sino cuánto se aparta un mes de la media de un periodo de referencia fijo. Para los datos de la NASA (GISTEMP) ese periodo es <b>1951–1980</b>. «+1 °C» significa, por tanto: 1 °C más cálido que la media de esas tres décadas." },
      { h:"2 · ¿Por qué dos periodos de referencia?",
        body:"La ciencia usa <b>1951–1980</b> porque está medido de forma densa y fiable en todo el mundo — un punto cero estable para la serie de datos. La política climática (el Acuerdo de París) se mide respecto al <b>«nivel preindustrial» (1850–1900)</b>, porque el objetivo es limitar el calentamiento de origen humano <em>desde el inicio de la industrialización</em>. Pregunta distinta, punto cero distinto." },
      { h:"3 · El desfase: +0,19 °C.",
        body:"Ya en 1951–1980 el mundo era aproximadamente <b>0,19 °C más cálido</b> que en 1850–1900 (valor de la NASA GISS según las preguntas frecuentes de GISTEMP, a enero de 2025). Convertir significa sumar esos 0,19 °C. Por eso las <b>líneas de París quedan más hacia dentro</b> que nuestros anillos del mismo nombre:<ul><li>Nuestro <b>anillo de +1,5 °C</b> ≈ <b>+1,7 °C sobre el nivel preindustrial</b> — ya <em>más allá</em> del objetivo de París.</li><li>El verdadero <b>límite de París de 1,5 °C</b> se sitúa en nuestra escala en <b>+1,31 °C</b>, y el <b>límite de 2 °C</b> en <b>+1,81 °C</b>. Eso es exactamente lo que traza el interruptor «Anillos de París».</li></ul><br><br><span class=\"sub\">Cuán sólidos son esos 0,19 °C.</span> La conversión es más burda de lo que sugieren dos decimales:<ul><li><b>Un único valor para los doce meses.</b> El desfase real tiene un ciclo estacional: calculado a partir de los datos brutos de Berkeley Earth, oscila entre unos <b>+0,22 °C (julio)</b> y <b>+0,36 °C (noviembre)</b> — un rango de 0,14 °C, tan grande como la propia corrección. Para medias anuales o plurianuales un valor fijo no es problema; para un mes aislado es una aproximación. Copernicus lo dice explícitamente: un desfase único sirve para medias de doce meses, los periodos más cortos requieren supuestos adicionales.</li><li><b>El desfase depende del conjunto de datos.</b> Berkeley Earth usa el mismo periodo de referencia 1951–1980 y obtiene <b>+0,31 °C</b>; la OMM cifra la incertidumbre del desfase en 0,12 °C. Con +0,19 °C, esta conversión se sitúa en el extremo bajo: para 2011–2020 da 1,02 °C sobre el nivel preindustrial, mientras que el IPCC AR6 evalúa el calentamiento de esa década en <b>1,09 °C</b>.</li><li><b>Los anillos son una línea de referencia, no un veredicto.</b> Muestran dónde caen los umbrales de París en este eje — no que se hayan alcanzado. El IPCC evalúa la superación con una <b>media de 20 años</b> (AR6 SPM, nota 26; el párrafo B.1.4 señala que un solo año por encima de 1,5 °C no significa que se haya alcanzado ese nivel — solo la variabilidad interna hace que un año aislado varíe ±0,25 °C). Convertida a la base preindustrial, la media de los años 2006–2025 se sitúa en torno a 1,04 °C.</li></ul>" },
      { h:"4 · Mantener la honestidad: un mes récord ≠ objetivo superado.",
        body:"El objetivo de París de 1,5 °C se refiere a la <b>media de largo plazo</b> (~20 años), no a meses aislados. Meses récord como septiembre de 2023 ya superaron 1,5 °C sobre el nivel preindustrial — pero la media de 20 años de esta serie (2006–2025) está todavía en torno a solo <b>1,04 °C</b> sobre el nivel preindustrial. Decir que «el objetivo está superado» sería, por tanto, prematuro. Las cifras más altas que circulan para «el calentamiento actual» miden ventanas más cortas y recientes: los últimos cinco años de esta serie promedian alrededor de 1,27 °C. Periodos completos de 12 meses ya han superado 1,5 °C desde 2024 (Copernicus/ERA5) — pero París se evalúa con la media de largo plazo, no con años aislados." },
      { h:"5 · La forma resalta los años cálidos — a propósito, pero conviene saberlo.",
        body:"El radio de un mes es su anomalía <em>más</em> una distancia fija al centro. Los valores fríos quedan apretados en el centro, los cálidos se extienden lejos hacia fuera — y allí, cada vuelta es más larga, porque la circunferencia crece con el radio. Los años cálidos reciben así más línea y más «tinta» que oscilaciones hacia abajo de igual magnitud. El embudo en 3D lo acentúa: las vueltas tardías y anchas parecen más grandes que las primeras, apretadas en el cuello estrecho. Esto <b>no es un truco numérico</b> — es la misma representación que usan Ed Hawkins y la NASA — pero conviene saberlo. Para comparar magnitudes con criterio: <b>«Vista cenital»</b> aplana el embudo, el control deslizante <b>«Altura»</b> ajusta cuánto exagera, y cada anillo de escala lleva su valor real en °C. Lo que cuenta es la cifra, no la superficie." },
      { h:"6 · Los récords de 2023/24 no son solo la tendencia.",
        body:"Los picos espectaculares de 2023 y 2024 coincidieron con una fuerte <b>fase de El Niño</b> — un patrón natural que empuja brevemente calor adicional del Pacífico hacia la temperatura global. El aumento de fondo por debajo es el calentamiento de origen humano, pero un solo mes récord no debe leerse como el nuevo estado permanente. El interruptor <b>«Super El Niño»</b> marca las fases de El Niño más fuertes (pico de ONI ≥ 2,0 — la categoría más rara) para poder distinguir ambas cosas." },
      { h:"CO₂: dos fuentes, una curva",
        body:"La curva violeta de la derecha muestra el CO₂ atmosférico — la causa, mientras que la espiral muestra el efecto.<br><br><span class=\"sub\">Dos series, una costura visible.</span> Procede de <b>dos</b> series de medición. A partir de marzo de 1958 son valores mensuales de Mauna Loa (NOAA GML); antes de eso, la curva suavizada de Law Dome a partir de testigos de hielo antárticos. La costura se muestra en lugar de ocultarse: <b>discontinua</b> antes de 1958, <b>continua</b> después.<br><br><span class=\"sub\">Por qué la parte discontinua es lisa.</span> El testigo de hielo da valores <em>anuales</em>. Para esta representación se interpolan a la cuadrícula mensual — la parte discontinua está, por tanto, calculada, no medida mes a mes. Por la misma razón carece de ciclo estacional: el aire tarda alrededor de una década en quedar atrapado en la capa de firn, lo que suaviza la variación anual. A partir de 1958 sería medible — la respiración de la vegetación del hemisferio norte, unos 6 ppm al año. Aun así no se dibuja: en una franja de 200 ppm de ancho, 6 ppm son menos de dos píxeles, lo que parecería una línea mal trazada más que una señal. Por eso la curva muestra en todo momento la tendencia desestacionalizada.<br><br><span class=\"sub\">Por qué se cambia de serie en vez de mezclarlas.</span> Las dos series miden lugares distintos. En la propia costura la curva no da un salto: los dos valores están separados por 0,57 ppm, invisible en una franja de 140 ppm. A lo largo de las décadas siguientes divergen de forma sistemática: Mauna Loa está a 19° norte, las estaciones antárticas muy al sur, y como casi todas las emisiones se producen en el hemisferio norte, el norte marca valores más altos — unos 1,4 ppm en 1960, unos 3,4 ppm en 1990. La brecha crece con las emisiones. Esa cifra indica, por tanto, dónde se produce la combustión." },
      { h:"Lo que este gráfico no afirma",
        body:"Dos curvas que suben a la vez son una <b>correlación</b> — no una prueba. Que el CO₂ impulsa el calentamiento se sabe por la física de la radiación: por mediciones de laboratorio de sus bandas de absorción, por mediciones satelitales de la radiación infrarroja saliente, por la comparación de modelos con y sin gases de efecto invernadero. Esta representación coloca dos series medidas una junto a otra. No deduce una de la otra, ni puede hacerlo." },
      { h:"Perspectiva: por qué la curva parece más o menos pronunciada según el ángulo",
        body:"La curva de CO₂ se sitúa en un espacio tridimensional, así que parece más o menos pronunciada según el ángulo de vista. En la vista predeterminada — cámara sobre el embudo — el rango en ppm es, arriba, alrededor de <b>25 % más ancho</b> que abajo. Eso le da al ascenso más reciente un poco más de recorrido del que le corresponde.<br><br>Esto es una propiedad del ángulo, no de los datos. A la altura del centro de la franja el efecto desaparece por completo — para eso está el botón <em>Vista lateral</em>. Visto desde abajo incluso se invierte y <em>subestima</em> el ascenso.<br><br>Las líneas de cuadrícula verticales se deforman exactamente igual que la curva. Por eso cualquier valor leído es correcto a cualquier altura: donde la curva cruza la línea de 400, son 400 ppm, sin importar dónde esté la cámara. Lo que se distorsiona es la impresión de pendiente — no la cifra." },
      { h:"Quién construyó esto",
        body:"Esto no es investigación original, y el autor no es climatólogo. La espiral visualiza series de datos publicadas por instituciones reconocidas: las temperaturas de <b>NASA GISTEMP v4</b>, el CO₂ del <b>testigo de hielo de Law Dome</b> y del <b>NOAA Global Monitoring Laboratory</b> (Mauna Loa). Los valores se toman sin modificar; el procesamiento está documentado.<br><br>Lo que la representación logra y dónde es débil se indica abiertamente en esta ventana — las secciones sobre la geometría y sobre el periodo de referencia nombran las distorsiones conocidas. Si encuentras un error: las correcciones son bienvenidas, <b>contact@aeternalabs.io</b>.<br><br>La misma espiral existe como video terminado en cuatro versiones (cuadrado y vertical, alemán e inglés, con y sin anillos de París) — para ver y descargar en 4K en «Ver la espiral en video»." },
    ],
    co2Note: "CO₂: testigo de hielo hasta 1958 (discontinuo), Mauna Loa después —&nbsp;<span class=\"info-i\">ⓘ</span>",
    src: "Fuentes: NASA GISTEMP v4 · desfase de referencia GISS · IPCC AR6 · representación según Ed Hawkins / NASA SVS · CO₂: NOAA GML Mauna Loa; Law Dome (Etheridge et al., MacFarling Meure et al.) vía NOAA NCEI Paleo",
  },
  pt: {
    title: "Período de referência, metas de Paris e como ler a representação",
    subtitle: "O que os valores em °C significam — e o que a representação realça",
    close: "Fechar",
    note: 'Paris mede em relação a 1850–1900 (+0,19 °C) · o que significa isso?&nbsp;<span class="info-i">ⓘ</span>',
    sections: [
      { h:"1 · Cada número é uma anomalia, não uma leitura de termómetro.",
        body:"A espiral não mostra <em>a</em> temperatura — mostra o quanto um mês se afasta da média de um período de referência fixo. Nos dados da NASA (GISTEMP) esse período é <b>1951–1980</b>. «+1 °C» significa, portanto: 1 °C mais quente do que a média dessas três décadas." },
      { h:"2 · Porquê dois períodos de referência?",
        body:"A ciência usa <b>1951–1980</b> porque esse período está medido de forma densa e fiável em todo o mundo — um ponto zero estável para a série de dados. A política climática (o Acordo de Paris) mede-se em relação ao <b>«nível pré-industrial» (1850–1900)</b>, porque o objetivo é limitar o aquecimento de origem humana <em>desde o início da industrialização</em>. Pergunta diferente, ponto zero diferente." },
      { h:"3 · O desvio: +0,19 °C.",
        body:"Já em 1951–1980 o mundo estava cerca de <b>0,19 °C mais quente</b> do que em 1850–1900 (valor da NASA GISS segundo as perguntas frequentes do GISTEMP, em janeiro de 2025). Converter significa somar esses 0,19 °C. Por isso as <b>linhas de Paris ficam mais para dentro</b> do que os nossos anéis com o mesmo nome:<ul><li>O nosso <b>anel de +1,5 °C</b> ≈ <b>+1,7 °C acima do nível pré-industrial</b> — já <em>além</em> da meta de Paris.</li><li>O verdadeiro <b>limite de Paris de 1,5 °C</b> situa-se, na nossa escala, em <b>+1,31 °C</b>, e o <b>limite de 2 °C</b> em <b>+1,81 °C</b>. É exatamente isso que o interruptor «Anéis de Paris» traça.</li></ul><br><br><span class=\"sub\">Quão sólidos são esses 0,19 °C.</span> A conversão é mais grosseira do que duas casas decimais sugerem:<ul><li><b>Um único valor para os doze meses.</b> O desvio real tem um ciclo sazonal: calculado a partir dos dados brutos da Berkeley Earth, varia entre cerca de <b>+0,22 °C (julho)</b> e <b>+0,36 °C (novembro)</b> — uma amplitude de 0,14 °C, tão grande quanto a própria correção. Para médias anuais ou plurianuais um valor fixo não é problema; para um único mês é uma aproximação. A Copernicus diz isso explicitamente: um desvio único serve para médias de doze meses, períodos mais curtos exigem pressupostos adicionais.</li><li><b>O desvio depende do conjunto de dados.</b> A Berkeley Earth usa o mesmo período de referência 1951–1980 e obtém <b>+0,31 °C</b>; a OMM estima a incerteza do desvio em 0,12 °C. Com +0,19 °C, esta conversão situa-se no extremo inferior: para 2011–2020 dá 1,02 °C acima do nível pré-industrial, enquanto o IPCC AR6 avalia o aquecimento dessa década em <b>1,09 °C</b>.</li><li><b>Os anéis são uma linha de referência, não um veredito.</b> Mostram onde caem os limiares de Paris neste eixo — não que tenham sido alcançados. O IPCC avalia a ultrapassagem com uma <b>média de 20 anos</b> (AR6 SPM, nota 26; o parágrafo B.1.4 assinala que um único ano acima de 1,5 °C não significa que esse nível tenha sido alcançado — só a variabilidade interna faz um ano isolado variar ±0,25 °C). Convertida para a base pré-industrial, a média dos anos 2006–2025 situa-se em cerca de 1,04 °C.</li></ul>" },
      { h:"4 · Manter a honestidade: um mês recorde ≠ meta ultrapassada.",
        body:"A meta de Paris de 1,5 °C refere-se à <b>média de longo prazo</b> (~20 anos), não a meses isolados. Meses recorde como setembro de 2023 já ultrapassaram 1,5 °C acima do nível pré-industrial — mas a média de 20 anos desta série (2006–2025) está ainda em cerca de apenas <b>1,04 °C</b> acima do nível pré-industrial. Dizer que «a meta foi ultrapassada» seria, portanto, prematuro. Os valores mais altos citados para «o aquecimento atual» medem janelas mais curtas e recentes: os últimos cinco anos desta série têm uma média de cerca de 1,27 °C. Períodos completos de 12 meses já ultrapassaram 1,5 °C desde 2024 (Copernicus/ERA5) — mas Paris é avaliado pela média de longo prazo, não por anos isolados." },
      { h:"5 · A forma realça os anos quentes — de propósito, mas é bom saber.",
        body:"O raio de um mês é a sua anomalia <em>mais</em> uma distância fixa ao centro. Os valores frios ficam apertados no meio, os quentes estendem-se longe para fora — e lá fora cada volta é mais longa, porque a circunferência cresce com o raio. Os anos quentes recebem assim mais linha e mais «tinta» do que oscilações para baixo de igual magnitude. O funil em 3D reforça isso: as voltas tardias e largas parecem maiores do que as primeiras, apertadas no gargalo estreito. Isto <b>não é um truque numérico</b> — é a mesma representação que Ed Hawkins e a NASA usam — mas convém saber. Para comparar magnitudes com rigor: a <b>«Vista de cima»</b> achata o funil, o controlo deslizante <b>«Altura»</b> ajusta o quanto exagera, e cada anel de escala traz o seu valor real em °C. O que conta é o número, não a área." },
      { h:"6 · Os recordes de 2023/24 não são apenas a tendência.",
        body:"Os picos espetaculares de 2023 e 2024 coincidiram com uma forte <b>fase de El Niño</b> — um padrão natural que empurra brevemente calor adicional do Pacífico para a temperatura global. A subida de fundo por baixo é o aquecimento de origem humana, mas um único mês recorde não deve ser lido como o novo estado permanente. O interruptor <b>«Super El Niño»</b> assinala as fases de El Niño mais fortes (pico de ONI ≥ 2,0 — a categoria mais rara) para se poder distinguir as duas coisas." },
      { h:"CO₂: duas fontes, uma curva",
        body:"A curva violeta à direita mostra o CO₂ atmosférico — a causa, enquanto a espiral mostra o efeito.<br><br><span class=\"sub\">Duas séries, uma costura visível.</span> Provém de <b>duas</b> séries de medição. A partir de março de 1958 são valores mensais de Mauna Loa (NOAA GML); antes disso, a curva suavizada de Law Dome a partir de testemunhos de gelo antárticos. A costura é mostrada em vez de escondida: <b>tracejada</b> antes de 1958, <b>contínua</b> depois.<br><br><span class=\"sub\">Porque é que a parte tracejada é lisa.</span> O testemunho de gelo dá valores <em>anuais</em>. Para esta representação são interpolados para a grelha mensal — a parte tracejada é, portanto, calculada, não medida mês a mês. Pela mesma razão não tem ciclo sazonal: o ar demora cerca de uma década a ficar retido na camada de firn, o que suaviza a variação anual. A partir de 1958 seria mensurável — a respiração da vegetação do hemisfério norte, cerca de 6 ppm por ano. Mesmo assim não é desenhada: numa faixa com 200 ppm de largura, 6 ppm são menos de dois pixels, o que pareceria uma linha mal traçada em vez de um sinal. Por isso a curva mostra sempre a tendência dessazonalizada.<br><br><span class=\"sub\">Porque se muda de série em vez de as misturar.</span> As duas séries medem locais diferentes. Na própria costura a curva não dá um salto: os dois valores estão separados por 0,57 ppm, invisível numa faixa de 140 ppm. Ao longo das décadas seguintes divergem de forma sistemática: Mauna Loa fica a 19° norte, as estações antárticas muito a sul, e como quase todas as emissões ocorrem no hemisfério norte, o norte regista valores mais altos — cerca de 1,4 ppm em 1960, cerca de 3,4 ppm em 1990. A diferença cresce com as emissões. Esse número indica, portanto, onde ocorre a combustão." },
      { h:"O que este gráfico não afirma",
        body:"Duas curvas que sobem ao mesmo tempo são uma <b>correlação</b> — não é uma prova. Que o CO₂ impulsiona o aquecimento sabe-se pela física da radiação: por medições laboratoriais das suas bandas de absorção, por medições de satélite da radiação infravermelha emitida, pela comparação de modelos com e sem gases com efeito de estufa. Esta representação coloca duas séries medidas lado a lado. Não deduz uma da outra, nem pode fazê-lo." },
      { h:"Perspetiva: porque é que a curva parece mais ou menos inclinada consoante o ângulo",
        body:"A curva de CO₂ situa-se num espaço tridimensional, por isso parece mais ou menos inclinada consoante o ângulo de visão. Na vista predefinida — câmara acima do funil — o intervalo em ppm é, em cima, cerca de <b>25 % mais largo</b> do que em baixo. Isso dá à subida mais recente um pouco mais de percurso do que lhe cabe.<br><br>Isto é uma propriedade do ângulo, não dos dados. À altura do centro da faixa o efeito desaparece por completo — é para isso que serve o botão <em>Vista lateral</em>. Visto de baixo inverte-se mesmo e <em>subestima</em> a subida.<br><br>As linhas de grelha verticais distorcem-se exatamente como a curva. Por isso qualquer valor lido é correto a qualquer altura: onde a curva cruza a linha dos 400, são 400 ppm, seja qual for a posição da câmara. O que se distorce é a impressão de inclinação — não o número." },
      { h:"Quem construiu isto",
        body:"Isto não é investigação original, e o autor não é climatologista. A espiral visualiza séries de dados publicadas por instituições reconhecidas: as temperaturas da <b>NASA GISTEMP v4</b>, o CO₂ do <b>testemunho de gelo de Law Dome</b> e do <b>NOAA Global Monitoring Laboratory</b> (Mauna Loa). Os valores são usados sem alterações; o processamento está documentado.<br><br>O que a representação consegue e onde é fraca é indicado abertamente nesta janela — as secções sobre a geometria e sobre o período de referência nomeiam as distorções conhecidas. Se encontrar um erro: as correções são bem-vindas, <b>contact@aeternalabs.io</b>.<br><br>A mesma espiral existe como vídeo terminado em quatro versões (quadrado e vertical, alemão e inglês, com e sem anéis de Paris) — para ver e descarregar em 4K em «Ver a espiral em vídeo»." },
    ],
