      tl.fromTo("#endlabel .inner",{ opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 53.0);
      window.__timelines["main"] = tl;
    </script>

      const aspect = W / H_PX;
      const FOV = PORTRAIT ? 40 : 42;
      const camera = new THREE.PerspectiveCamera(FOV, aspect, 0.1, 200);
      const CAM_DIST = PORTRAIT ? 21 : 13;

      // ---- spiral (fat line, vertex-colored) ----
      const spiralMat = new THREE.LineMaterial({ linewidth: PORTRAIT ? 3.6 : 4.3, vertexColors: true, transparent: true, opacity: 1 });
      spiralMat.resolution.set(W, H_PX);
      const spiralGeo = new THREE.LineGeometry();
      // Build the FULL geometry ONCE (flat, y=0). Build-up via instanceCount, funnel via
      // in-place mutation of the interleaved buffer (repeated setPositions() does NOT
      // re-upload reliably across many seeks in one page).
      const fullPos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) { fullPos[3*i] = baseX[i]; fullPos[3*i+1] = 0; fullPos[3*i+2] = baseZ[i]; }
      spiralGeo.setPositions(fullPos);
      spiralGeo.setColors(colArr);
      const spiral = new THREE.Line2(spiralGeo, spiralMat);
      spiral.frustumCulled = false;
      spiral.renderOrder = 3;
      spiral.visible = false;
      scene.add(spiral);
      const instPos = spiralGeo.attributes.instanceStart.data; // interleaved, (N-1)*6 floats

      // ---- reference rings (flat, on floor y=0) ----
      function circlePts(radius, seg = 160) {
        const a = [];
        for (let i = 0; i <= seg; i++) {
          const th = i / seg * Math.PI * 2;
          a.push(radius * Math.sin(th), 0, radius * Math.cos(th));
        }
        return a;
      }
      function makeRing(radius, color, { dashed = false, opacity = 0.8, lw = 2 } = {}) {
        const g = new THREE.LineGeometry();
        g.setPositions(circlePts(radius));
        const m = new THREE.LineMaterial({ color, linewidth: lw, transparent: true, opacity, dashed, dashSize: 0.24, gapSize: 0.18 });
        m.resolution.set(W, H_PX);
        const l = new THREE.Line2(g, m);
        if (dashed) l.computeLineDistances();
        l.renderOrder = 2;
        scene.add(l);
        return l;
      }
      // 0 = white baseline; 0.5/1/1.5/2 take the line's colour at that temperature
      const RING_DEFS = [
        { v: 0.0, color: 0xffffff,   dashed: false, base: 0.55, lw: 1.8, label: "0 °C", lcolor: "#ffffff" },
        { v: 0.5, color: vhex(0.5),  dashed: false, base: 0.65, lw: 2.0, label: ringFmt(0.5), lcolor: vcss(0.5) },
        { v: 1.0, color: vhex(1.0),  dashed: false, base: 0.70, lw: 2.2, label: ringFmt(1.0), lcolor: vcss(1.0) },
        { v: 1.5, color: vhex(1.5),  dashed: true,  base: 0.85, lw: 2.6, label: ringFmt(1.5), lcolor: vcss(1.5) },
        { v: 2.0, color: vhex(2.0),  dashed: true,  base: 0.85, lw: 2.6, label: ringFmt(2.0), lcolor: vcss(2.0) },
      ];
      const rings = RING_DEFS.map(d => ({
        l: makeRing(rho(d.v), d.color, { dashed: d.dashed, opacity: d.base, lw: d.lw }),
        base: d.base,
        v: d.v,
      }));

      // ---- 3D guide-wall cylinder (single leading wall, additive glow like the web app) ----
      // AdditiveBlending + opacity 0.11 makes the wall clearly readable against black (the old
      // ~0.02-0.028 non-additive walls were nearly invisible). Only the wall for the active
      // RENDER_MODE is built; the other rings' walls are intentionally omitted to keep the focus.
      function makeCyl(radius, color, baseOp) {
        const g = new THREE.CylinderGeometry(radius, radius, 1, 120, 1, true);
        const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
        const mesh = new THREE.Mesh(g, m);
        mesh.renderOrder = 1; mesh.visible = false;
        scene.add(mesh);
        return { mesh, baseOp };
      }
      // cyl15: the +1.5 °C anomaly wall.  paris: the Paris-1.5 wall at +1.31 °C (copper), replacing it.
      const CYL_DEFS = {
        cyl15: { r: rho(1.5),               color: vhex(1.5),                   op: 0.11 },
        paris: { r: rho(1.5 - PARIS_OFFSET), color: new THREE.Color(0xE9B863),  op: 0.11 },
      };
      const _cd = CYL_DEFS[RENDER_MODE];
      const cyls = [ makeCyl(_cd.r, _cd.color, _cd.op) ];

      // ---- text sprites ----
      // Every text sprite carries a redraw() closure so its canvas texture can be regenerated once
      // the webfonts finish loading (see the font-ready gate in renderAt). A dark stroke + soft glow
      // is baked into the canvas so labels stay legible over the bright spiral lines and background.
      const textSprites = [];
      const DM_SANS = '"DM Sans", system-ui, Arial, sans-serif';
      const PLEX_MONO = '"IBM Plex Mono", ui-monospace, monospace';
      function drawSpriteCanvas(text, o) {
        const font = `${o.weight} ${o.fontPx}px ${o.family}`;
        const meas = document.createElement("canvas").getContext("2d");
        meas.font = font;
        const pad = 34;
        const w = Math.ceil(meas.measureText(text).width) + pad * 2;
        const h = o.fontPx + pad * 2;
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        // baked dark outline + soft glow for legibility (mirrors the web-app label halo)
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(6,5,4,0.95)";
        ctx.lineWidth = Math.max(3, o.fontPx * 0.11);
        ctx.shadowColor = "rgba(6,5,4,0.95)";
        ctx.shadowBlur = o.fontPx * 0.28;
        ctx.strokeText(text, w / 2, h / 2);
        ctx.shadowBlur = 0;
        ctx.strokeText(text, w / 2, h / 2);
        ctx.fillStyle = o.color;
        ctx.fillText(text, w / 2, h / 2);
        return { c, w, h };
      }
      function makeTextSprite(text, opts = {}) {
        const o = Object.assign({ fontPx: 76, color: "#ffffff", weight: "700", baseH: 0.62, family: DM_SANS }, opts);
        const first = drawSpriteCanvas(text, o);
        const tex = new THREE.CanvasTexture(first.c);
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(o.baseH * (first.w / first.h), o.baseH, 1);
        sp.renderOrder = 5;
        scene.add(sp);
        sp.userData.redraw = () => {
          const r = drawSpriteCanvas(text, o);
          const ntex = new THREE.CanvasTexture(r.c);
          ntex.minFilter = THREE.LinearFilter; ntex.magFilter = THREE.LinearFilter; ntex.generateMipmaps = false;
          if (mat.map) mat.map.dispose();
          mat.map = ntex; mat.needsUpdate = true;
          sp.scale.set(o.baseH * (r.w / r.h), o.baseH, 1);
        };
        textSprites.push(sp);
        return sp;
      }
      let spritesFresh = false;   // flips true once webfonts are loaded and every sprite has been redrawn

      // month labels around the outside, on the floor plane (DM Sans)
      const MONTHS = MONTHS_ABBR[LANG];        // 3-letter, localized
      const monthR = rho(2.0) + 0.66;
      const monthSprites = MONTHS.map((mn, idx) => {
        const th = -(idx / 12 * Math.PI * 2);
        const sp = makeTextSprite(mn, { fontPx: 60, color: "#9aa3ad", weight: "600", baseH: 0.42, family: DM_SANS });
        sp.position.set(monthR * Math.sin(th), 0.001, monthR * Math.cos(th));
        return sp;
      });

      // Ring labels (IBM Plex Mono) fanned by equal arc-length so inner rings get a wider angular
      // step (no overlap), and centred on RING_FAN_C — the azimuth that faces the camera AFTER the
      // end tilt/rotation, so the labels sit in front of / beside the funnel instead of behind it.
      // See setCamera(): at the final frame the camera looks from az≈0.72 rad, whose near-side
      // floor azimuth is π+0.72 ≈ 3.86 rad. Positions are static; only opacity animates.
      const RING_FAN_C = 3.86;
      const _fanRaw = [];
      { let acc = 0; for (let i = 0; i < RING_DEFS.length; i++) { if (i > 0) acc += 1.334 / rho(RING_DEFS[i].v); _fanRaw.push(acc); } }
      const _fanMid = (_fanRaw[0] + _fanRaw[_fanRaw.length - 1]) / 2;
      const ringLabels = RING_DEFS.map((d, i) => {
        const sp = makeTextSprite(d.label, { fontPx: 64, color: d.lcolor, weight: "500", baseH: 0.5, family: PLEX_MONO });
        const r = rho(d.v);
        const az = RING_FAN_C + (_fanRaw[i] - _fanMid);
        sp.position.set(r * Math.sin(az), 0.02, r * Math.cos(az));
        sp.userData.radius = r; sp.userData.az = az; sp.userData.v = d.v;
        return sp;
      });

      // ---- Paris-Agreement inner ring pair (RENDER_MODE "paris" only) ----
      // Our anomaly rings are vs 1951-1980; the Paris 1.5/2.0 pre-industrial limits sit PARIS_OFFSET
      // further IN, i.e. at +1.31 °C and +1.81 °C on our scale. Distinct dashed rings + copper/red
      // labels, fanned + haloed like the scale labels, kept clear of the scale-ring fan.
      const PARIS_DEFS = [
        { pv: 1.5, color: 0xE9B863, css: "#E9B863", az: 4.30, label: LANG === "de" ? "Paris 1,5 °C" : "Paris 1.5 °C" },
        { pv: 2.0, color: 0xEF4444, css: "#EF4444", az: 3.95, label: LANG === "de" ? "Paris 2,0 °C" : "Paris 2.0 °C" },
      ];
      const parisRings = PARIS_DEFS.map(cfg => {
        const r = rho(cfg.pv - PARIS_OFFSET);
        const g = new THREE.LineGeometry();
        g.setPositions(circlePts(r));
        const m = new THREE.LineMaterial({ color: cfg.color, linewidth: 2.0, transparent: true, opacity: 0, dashed: true, dashSize: 0.16, gapSize: 0.14 });
        m.resolution.set(W, H_PX);
        const l = new THREE.Line2(g, m); l.computeLineDistances(); l.renderOrder = 2; l.visible = false;
        scene.add(l);
        const lab = makeTextSprite(cfg.label, { fontPx: 62, color: cfg.css, weight: "500", baseH: 0.5, family: PLEX_MONO });
        lab.position.set(r * Math.sin(cfg.az), 0.02, r * Math.cos(cfg.az));
        lab.material.opacity = 0; lab.visible = false;
        return { l, lab };
      });

      // ---- comet head + glow ----
      function glowTexture() {
        const s = 128, c = document.createElement("canvas");
        c.width = c.height = s;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
        grad.addColorStop(0.0, "rgba(255,255,255,1)");
        grad.addColorStop(0.25, "rgba(255,255,255,0.75)");
        grad.addColorStop(1.0, "rgba(255,255,255,0)");
        g.fillStyle = grad; g.fillRect(0, 0, s, s);
        return new THREE.CanvasTexture(c);
      }
      const gtex = glowTexture();
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: gtex, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false }));
      glow.scale.set(1.15, 1.15, 1); glow.renderOrder = 6; scene.add(glow);
      const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: gtex, transparent: true, opacity: 1, depthTest: false, depthWrite: false }));
      head.scale.set(0.34, 0.34, 1); head.renderOrder = 7; scene.add(head);

      // ---- camera rig as a function of tilt param k (and hold rotation) ----
      function setCamera(kCam, holdP) {
        const elev = lerp(88 * DEG, (PORTRAIT ? 30 : 36) * DEG, kCam);
        const dist = lerp(CAM_DIST, CAM_DIST * (PORTRAIT ? 1.12 : 1.85), kCam);
        const targetY = lerp(0, HFUN * 0.5, kCam);
        const horiz = dist * Math.cos(elev);
        const vert  = dist * Math.sin(elev);
        const az = holdP * 0.72;                  // longer, calmer end rotation
        const camX = -horiz * Math.sin(az);
        const camZ = -horiz * Math.cos(az);
        camera.up.set(0, 1, 0);
        camera.position.set(camX, targetY + vert, camZ);
        camera.lookAt(0, targetY, 0);
      }

      // ---- per-frame state from time ----
      let lastKy = -1;
      function updateSpiral(nVisible, k) {
        spiral.visible = nVisible >= 2;
        spiralGeo.instanceCount = Math.max(0, nVisible - 1);
        if (k !== lastKy) {
          lastKy = k;
          const a = instPos.array;
          for (let i = 0; i < N - 1; i++) {
            a[6*i + 1] = k * yFull[i];
            a[6*i + 4] = k * yFull[i + 1];
          }
          instPos.needsUpdate = true;
        }
      }

      function renderAt(time) {
        // Font-ready gate: once both webfonts report loaded, redraw every text sprite so the final
        // texture uses the real font (never the fallback). document.fonts.check() is synchronous and
        // deterministic; the render engine only begins capturing after document.fonts.ready, so the
        // first captured frame already passes this check and all frames render with the correct font.
        if (!spritesFresh && document.fonts && document.fonts.check &&
            document.fonts.check('500 54px "IBM Plex Mono"') &&
            document.fonts.check('600 60px "DM Sans"')) {
          for (const s of textSprites) s.userData.redraw();
          spritesFresh = true;
        }

        const t = clamp01(time / DURATION);
        const introP = clamp01(t / T_INTRO);
        const buildLin = clamp01((t - T_INTRO) / (T_BUILD_END - T_INTRO));
        const buildP = 1 - Math.pow(1 - buildLin, BUILD_DECAY);   // decelerate toward the present
        const kRaw = clamp01((t - T_BUILD_END) / (T_TILT_END - T_BUILD_END));
        const kCam = easeInOut(kRaw);
        const holdP = clamp01((t - T_TILT_END) / (1 - T_TILT_END));

        const nVisible = Math.max(1, Math.min(N, 1 + Math.round(buildP * (N - 1))));
        const li = nVisible - 1;
        const k = kCam;

        updateSpiral(nVisible, k);

        const hx = baseX[li], hy = k * yFull[li], hz = baseZ[li];
        head.position.set(hx, hy, hz);
        glow.position.set(hx, hy, hz);
        const headVis = introP * (1 - 0.85 * holdP);
        head.material.opacity = headVis;
        glow.material.opacity = 0.55 * headVis;

        // Exclusive scale/Paris display: in "paris" mode the +0.5…+2 anomaly rings are hidden
        // entirely (not dimmed); only the neutral 0 °C baseline ring stays — it is the reference
        // that both the scale rings and the Paris limit rings are measured against. cyl15 shows all.
        const parisMode = RENDER_MODE === "paris";
        for (const r of rings) {
          const shown = r.v === 0 || !parisMode;
          r.l.visible = shown;
          r.l.material.opacity = shown ? r.base * introP : 0;
        }

        for (const c of cyls) {
          const hgt = Math.max(0.0001, k * HFUN);
          c.mesh.scale.set(1, hgt, 1);
          c.mesh.position.y = hgt / 2;
          c.mesh.material.opacity = c.baseOp * kCam * introP;
          c.mesh.visible = kCam > 0.002;
        }

        // Scale-ring labels stay on their fanned near-camera azimuth (positions are static) and
        // remain visible through the end tilt. In "paris" mode the +0.5…+2 labels are hidden
        // entirely (exclusive display); only the neutral "0 °C" baseline label stays.
        for (const lb of ringLabels) {
          const shown = lb.userData.v === 0 || !parisMode;
          lb.visible = shown;
          lb.material.opacity = shown ? introP * 0.95 : 0;
        }
        // Paris inner ring pair + labels — only in "paris" mode.
        for (const pr of parisRings) {
          pr.l.visible = parisMode;
          pr.l.material.opacity = parisMode ? 0.85 * introP : 0;
          pr.lab.visible = parisMode;
          pr.lab.material.opacity = parisMode ? 0.95 * introP : 0;
        }
        const monthOp = introP * (1 - 0.55 * kCam);
        for (const sp of monthSprites) sp.material.opacity = monthOp;

        const yr = 1880 + Math.floor(li / 12);
        const yEl = document.querySelector("#year .inner");
        if (yEl.textContent !== String(yr)) yEl.textContent = String(yr);

        setCamera(kCam, holdP);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
